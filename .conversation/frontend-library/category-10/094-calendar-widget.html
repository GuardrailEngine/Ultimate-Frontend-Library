<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f7f8; --surface:#fff; --ink:#1b2520; --muted:#829088; --line:#e1e7e2; --green:#25865b; --cream:#fff1d5; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f6f7f8,#e5f0e8); font:14px/1.5 "Manrope",sans-serif; } .calendar { width:min(520px,calc(100% - 36px)); padding:26px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 20px 55px #31523f12; } .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:23px; } .month { display:flex; align-items:center; gap:10px; } .month h1 { margin:0; font-size:22px; letter-spacing:-.06em; } .nav { display:flex; gap:5px; } .nav button { display:grid; place-items:center; width:29px; height:29px; border:1px solid var(--line); border-radius:7px; color:var(--ink); background:#fff; cursor:pointer; } .weekdays, .days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; } .weekdays { margin-bottom:8px; color:var(--muted); font-size:11px; font-weight:700; } .day { position:relative; display:grid; place-items:center; height:43px; border:0; border-radius:8px; color:var(--ink); background:transparent; cursor:pointer; } .day:hover { background:#eff5f0; } .day.muted { color:#c0c9c2; } .day.today { color:#fff; background:var(--green); font-weight:700; } .day.selected:not(.today) { outline:2px solid var(--green); outline-offset:-2px; } .day.event:after { content:""; position:absolute; bottom:5px; width:4px; height:4px; border-radius:50%; background:var(--green); } .event-list { margin-top:25px; padding-top:17px; border-top:1px solid var(--line); } .event-list h2 { margin:0 0 11px; font-size:14px; } .event { display:flex; align-items:center; gap:10px; padding:9px 0; } .event i { width:3px; height:30px; border-radius:3px; background:var(--green); } .event strong { display:block; font-size:13px; } .event small { color:var(--muted); }
  </style>
</head>
<body>
  <main class="calendar"><div class="head"><div class="month"><h1 id="month">September 2026</h1></div><div class="nav"><button id="prev" type="button" aria-label="Previous month">←</button><button id="next" type="button" aria-label="Next month">→</button></div></div><div class="weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div><div class="days" id="days"></div><div class="event-list"><h2 id="selectedDate">Today · September 05</h2><div class="event"><i></i><div><strong>Design review</strong><small>10:30 – 11:15 · Studio</small></div></div><div class="event"><i style="background:#e0a253"></i><div><strong>Team focus hour</strong><small>14:00 – 15:00 · Deep work</small></div></div></div></main>
  <script>
    const days=document.querySelector("#days"),monthLabel=document.querySelector("#month"),selectedLabel=document.querySelector("#selectedDate");let view=new Date(2026,8,5),selected=5;function render(){const year=view.getFullYear(),month=view.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,last=new Date(year,month+1,0).getDate(),prevLast=new Date(year,month,0).getDate();monthLabel.textContent=view.toLocaleDateString("en-US",{month:"long",year:"numeric"});let html="";for(let i=0;i<42;i++){const number=i-first+1,inMonth=number>0&&number<=last,day=inMonth?number:number<=0?prevLast+number:new Date(year,month+1,number-last).getDate(),date=new Date(year,month+(number<=0?-1:number>last?1:0),day),isSelected=inMonth&&day===selected&&view.getMonth()===8,isToday=year===2026&&month===8&&day===5&&inMonth,hasEvent=inMonth&&[5,9,12,18,23].includes(day);html+=`<button class="day ${inMonth?"":"muted"} ${isSelected?"selected":""} ${isToday?"today":""} ${hasEvent?"event":""}" data-day="${day}" ${inMonth?"":"disabled"} type="button">${day}</button>`}days.innerHTML=html;days.querySelectorAll(".day:not(:disabled)").forEach(day=>day.addEventListener("click",()=>{selected=Number(day.dataset.day);days.querySelectorAll(".selected").forEach(d=>d.classList.remove("selected"));day.classList.add("selected");selectedLabel.textContent=`Selected · ${new Date(year,month,selected).toLocaleDateString("en-US",{month:"long",day:"numeric"})}`}))}document.querySelector("#prev").addEventListener("click",()=>{view.setMonth(view.getMonth()-1);selected=0;render()});document.querySelector("#next").addEventListener("click",()=>{view.setMonth(view.getMonth()+1);selected=0;render()});render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Scramble Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#090b0f; --text:#f2f4ef; --muted:#8b938e; --lime:#d8f85d; --line:#2b332d; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 40% 60%,#26321a,transparent 30%),var(--bg); font:15px/1.5 "Space Grotesk",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--lime); font-weight:700; letter-spacing:.15em; text-transform:uppercase; } h1 { margin:15px 0 10px; font-size:clamp(45px,8vw,90px); line-height:.92; letter-spacing:-.1em; } p { margin:0 auto 58px; color:var(--muted); font-size:17px; } .scramble { min-width:205px; padding:16px 24px; border:1px solid var(--lime); border-radius:5px; color:var(--lime); background:transparent; font:700 14px "Space Grotesk",sans-serif; letter-spacing:.09em; cursor:pointer; } .scramble:hover { color:#10140c; background:var(--lime); } .status { min-height:22px; margin-top:22px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">A little entropy</span><h1>Ideas, reconfigured.</h1><p>Text can become part of the interaction. This button scrambles its label before revealing the next action.</p><button class="scramble" id="scramble" type="button"><span>REVEAL THE NEXT</span></button><div class="status" id="status">Press the button to begin</div></main>
  <script>
    const button = document.querySelector("#scramble"), label = button.querySelector("span"), status = document.querySelector("#status"), chars = "!<>-_\\/[]{}—=+*^?#________";
    function scrambleText(finalText) { let frame = 0, total = finalText.length * 3, timer = setInterval(() => { label.textContent = finalText.split("").map((letter, i) => { if (i < frame / 3) return letter; return chars[Math.floor(Math.random() * chars.length)]; }).join(""); frame++; if (frame > total) { clearInterval(timer); label.textContent = finalText; button.disabled = false; } }, 35); }
    button.addEventListener("click", () => { button.disabled = true; status.textContent = "Decoding the next move…"; scrambleText("START BUILDING"); setTimeout(() => status.textContent = "The next move is yours.", 1450); });
  </script>
</body>
</html>

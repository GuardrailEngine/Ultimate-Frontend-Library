<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f1f5f8; --ink:#1b2631; --muted:#7a8895; --blue:#3978dc; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(135deg,#f1f5f8,#dce9f8); font:15px/1.5 "DM Sans",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:14px 0 10px; font-size:clamp(42px,7vw,78px); line-height:1; letter-spacing:-.09em; } p { margin:0 auto 55px; color:var(--muted); font-size:17px; }
    .ripple { position:relative; overflow:hidden; min-width:170px; padding:15px 25px; border:0; border-radius:10px; color:#fff; background:var(--blue); box-shadow:0 9px 20px #3978dc4d; font-weight:700; cursor:pointer; } .ripple:focus-visible { outline:3px solid #8db6ff; outline-offset:4px; } .wave { position:absolute; border-radius:50%; background:#ffffff78; transform:scale(0); animation:ripple .6s linear; pointer-events:none; } @keyframes ripple { to { opacity:0; transform:scale(4); } } .response { min-height:22px; margin-top:21px; color:var(--blue); font-size:13px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">Material feedback</span><h1>Let the click travel.</h1><p>The ripple begins exactly where the user pressed, turning an invisible event into a clear, satisfying response.</p><button class="ripple" id="ripple" type="button">Add to collection</button><div class="response" id="response" role="status"></div></main>
  <script>
    const button = document.querySelector("#ripple"), response = document.querySelector("#response"); button.addEventListener("click", e => { const rect = button.getBoundingClientRect(), wave = document.createElement("span"), size = Math.max(rect.width, rect.height); wave.className = "wave"; wave.style.width = wave.style.height = `${size}px`; wave.style.left = `${e.clientX - rect.left - size / 2}px`; wave.style.top = `${e.clientY - rect.top - size / 2}px`; button.append(wave); wave.addEventListener("animationend", () => wave.remove()); response.textContent = "Added to your collection ✓"; });
  </script>
</body>
</html>

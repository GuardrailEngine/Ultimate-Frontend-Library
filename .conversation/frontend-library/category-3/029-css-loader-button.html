<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loader Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f7f9; --ink:#17222a; --muted:#85919a; --blue:#3274d6; --line:#dce4e9; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(140deg,#f4f7f9,#e5eef8); font:15px/1.5 "DM Sans",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:14px 0 10px; font-size:clamp(42px,7vw,77px); line-height:.95; letter-spacing:-.09em; } p { margin:0 auto 52px; color:var(--muted); font-size:17px; }
    .loader-button { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-width:165px; padding:15px 23px; border:0; border-radius:9px; color:#fff; background:var(--blue); box-shadow:0 8px 20px #3274d64a; font-weight:700; cursor:pointer; } .loader-button:disabled { cursor:wait; } .loader-button .loader { display:none; width:18px; height:18px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:spin .65s linear infinite; } .loader-button.loading .loader { display:block; } .loader-button.loading .label { opacity:.8; } @keyframes spin { to { transform:rotate(360deg); } } .status { min-height:22px; margin-top:22px; color:var(--blue); font-size:13px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">No library required</span><h1>Loading, made legible.</h1><p>A CSS-only spinner keeps the user oriented while a button waits for a result.</p><button class="loader-button" id="button" type="button"><i class="loader"></i><span class="label">Sync workspace</span></button><div class="status" id="status" role="status"></div></main>
  <script>
    const button = document.querySelector("#button"), label = button.querySelector(".label"), status = document.querySelector("#status"); button.addEventListener("click", () => { button.disabled = true; button.classList.add("loading"); label.textContent = "Syncing"; status.textContent = "Checking for changes…"; setTimeout(() => { button.classList.remove("loading"); button.disabled = false; label.textContent = "Sync again"; status.textContent = "Everything is up to date ✓"; }, 1800); });
  </script>
</body>
</html>

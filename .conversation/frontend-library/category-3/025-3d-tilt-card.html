<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tilt Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#090b15; --text:#f5f2ff; --muted:#a5a0b6; --purple:#a779ff; --pink:#ff78cb; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 20%,#382064,transparent 38%),var(--bg); font:15px/1.5 "Manrope",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--pink); font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:14px 0 10px; font-size:clamp(42px,7vw,78px); line-height:.95; letter-spacing:-.1em; } .intro { margin:0 auto 48px; color:var(--muted); font-size:17px; }
    .perspective { perspective:1000px; padding:20px; } .tilt-card { position:relative; display:flex; flex-direction:column; justify-content:space-between; width:min(320px,80vw); aspect-ratio:1.35; padding:27px; overflow:hidden; border:1px solid #ffffff2f; border-radius:22px; background:linear-gradient(135deg,#ffffff1c,#ffffff05),linear-gradient(145deg,#552d9a,#1a1235); box-shadow:0 25px 50px #0006; transform-style:preserve-3d; transition:transform .15s ease-out; text-align:left; } .tilt-card:after { content:""; position:absolute; top:-35%; right:-15%; width:190px; height:190px; border-radius:50%; background:#ff78cb55; filter:blur(25px); } .tilt-card strong, .tilt-card span { position:relative; z-index:1; transform:translateZ(28px); } .tilt-card strong { font-size:24px; letter-spacing:-.06em; } .tilt-card .number { color:#fff8; font-size:12px; letter-spacing:.12em; } .tilt-card .bottom { display:flex; justify-content:space-between; align-items:end; } .bottom span:last-child { color:#fff9; font-size:12px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">Depth on demand</span><h1>Make the surface move.</h1><p class="intro">A restrained tilt effect gives a card physical presence while keeping the content readable and grounded.</p><div class="perspective"><article class="tilt-card" id="card"><span class="number">NORTHSTAR / 2026</span><div class="bottom"><strong>Creative<br>direction</strong><span>View case study ↗</span></div></article></div></main>
  <script>
    const card = document.querySelector("#card"), perspective = document.querySelector(".perspective"); perspective.addEventListener("pointermove", e => { const box = card.getBoundingClientRect(), x = (e.clientX - box.left) / box.width - .5, y = (e.clientY - box.top) / box.height - .5; card.style.transform = `rotateX(${y * -12}deg) rotateY(${x * 14}deg) translateZ(8px)`; }); perspective.addEventListener("pointerleave", () => card.style.transform = ""); card.addEventListener("click", () => card.querySelector(".bottom span").textContent = "Case study opened ✓");
  </script>
</body>
</html>

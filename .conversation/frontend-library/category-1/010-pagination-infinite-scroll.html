<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination Infinite Scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f8f9fc; --surface:#fff; --text:#172033; --muted:#788397; --line:#e5e9f0; --purple:#6d55e8; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); font:15px/1.5 "DM Sans",sans-serif; } .page { max-width:1020px; margin:auto; padding:70px 22px 110px; } .top { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:36px; } .eyebrow { color:var(--purple); font-weight:700; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:10px 0 0; font-size:clamp(38px,6vw,68px); line-height:1; letter-spacing:-.08em; } .top p { margin:0; color:var(--muted); } .feed { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; } .item { display:flex; flex-direction:column; min-height:205px; padding:23px; border:1px solid var(--line); border-radius:15px; background:var(--surface); box-shadow:0 6px 20px #24365a08; animation:appear .35s both; } @keyframes appear { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } } .item .tag { align-self:start; padding:4px 8px; border-radius:5px; color:var(--purple); background:#eeeaff; font-size:11px; font-weight:700; text-transform:uppercase; } .item h2 { margin:25px 0 7px; font-size:22px; letter-spacing:-.04em; } .item p { margin:0; color:var(--muted); } .item time { margin-top:auto; padding-top:20px; color:#a3adbc; font-size:12px; }
    .loader { display:none; justify-content:center; gap:6px; padding:30px; } .loading .loader { display:flex; } .loader i { width:7px; height:7px; border-radius:50%; background:var(--purple); animation:bounce .7s infinite alternate; } .loader i:nth-child(2) { animation-delay:.15s; } .loader i:nth-child(3) { animation-delay:.3s; } @keyframes bounce { to { transform:translateY(-7px); opacity:.4; } } .sentinel { height:2px; } .load-more { display:block; margin:30px auto 0; padding:11px 17px; border:1px solid #cfc8fc; border-radius:8px; color:var(--purple); background:#fff; font-weight:700; cursor:pointer; } .load-more:hover { color:#fff; background:var(--purple); } .load-more:disabled { opacity:.55; cursor:wait; } .end { display:none; margin-top:28px; color:var(--muted); text-align:center; }
    @media(max-width:650px) { .top { display:block; } .top p { margin-top:15px; } .feed { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="page"><div class="top"><div><span class="eyebrow">The field notes</span><h1>Ideas in motion.</h1></div><p><span id="count">6</span> notes · loaded as you read</p></div><section class="feed" id="feed" aria-live="polite"></section><div class="loader" id="loader" aria-label="Loading more notes"><i></i><i></i><i></i></div><div class="sentinel" id="sentinel"></div><button class="load-more" id="loadMore" type="button">Load more notes</button><p class="end" id="end">You have reached the end of the notes.</p></main>
  <script>
    const notes = [
      ["Systems","The small interface is the real interface","A pattern earns its place when it makes the next decision feel lighter.","Today"],
      ["Practice","Design for the pause","The moments between actions are where trust quietly gets built.","Yesterday"],
      ["Culture","Make the handoff visible","A good collaboration leaves a trail people can follow without a meeting.","2 days ago"],
      ["Tools","The useful default","The best default is not the most neutral one. It is the one that helps people begin.","3 days ago"],
      ["Research","Ask the second question","The first answer describes the surface. The second one usually reveals the system.","4 days ago"],
      ["Fieldwork","Leave a little signal","A small, well-timed piece of feedback can carry more meaning than a dashboard full of numbers.","5 days ago"],
      ["Systems","Progress has a texture","People notice when a product remembers what they have already done.","6 days ago"],
      ["Practice","A room for unfinished ideas","Exploration becomes productive when the work can stay rough for a while.","Last week"],
      ["Culture","The quiet launch","A strong release gives the team as much confidence as it gives the customer.","Last week"]
    ];
    const feed = document.querySelector("#feed"), loadMore = document.querySelector("#loadMore"), loader = document.querySelector("#loader"), count = document.querySelector("#count"), end = document.querySelector("#end"); let shown = 0, batch = 3, loading = false;
    function addItems() { const fragment = document.createDocumentFragment(); notes.slice(shown, shown + batch).forEach((note, i) => { const article = document.createElement("article"); article.className = "item"; article.style.animationDelay = `${i * 60}ms`; article.innerHTML = `<span class="tag">${note[0]}</span><h2>${note[1]}</h2><p>${note[2]}</p><time>${note[3]}</time>`; fragment.append(article); }); shown = Math.min(shown + batch, notes.length); feed.append(fragment); count.textContent = shown; if (shown >= notes.length) { loadMore.hidden = true; end.style.display = "block"; } }
    function load() { if (loading || shown >= notes.length) return; loading = true; loadMore.disabled = true; loader.parentElement.classList.add("loading"); setTimeout(() => { addItems(); loading = false; loadMore.disabled = false; loader.parentElement.classList.remove("loading"); }, 650); }
    addItems(); loadMore.addEventListener("click", load); const observer = new IntersectionObserver(entries => { if (entries[0].isIntersecting) load(); }, { rootMargin:"180px" }); observer.observe(document.querySelector("#sentinel"));
  </script>
</body>
</html>

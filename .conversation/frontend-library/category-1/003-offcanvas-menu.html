<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offcanvas Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f3f0e9; --ink:#18221d; --muted:#647068; --accent:#ec6847; --line:#d7d4cb; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font:16px/1.5 "Space Grotesk",sans-serif; }
    .top { display:flex; align-items:center; justify-content:space-between; max-width:1180px; height:84px; margin:auto; padding:0 28px; } .wordmark { color:var(--ink); font-size:24px; font-weight:700; letter-spacing:-.06em; text-decoration:none; } .wordmark span { color:var(--accent); }
    .menu-trigger { display:flex; align-items:center; gap:11px; padding:11px 15px; border:1px solid var(--ink); border-radius:99px; color:var(--ink); background:transparent; cursor:pointer; } .menu-trigger:hover { color:#fff; background:var(--ink); }
    .menu-trigger b { display:block; width:18px; height:12px; border-top:2px solid currentColor; border-bottom:2px solid currentColor; position:relative; } .menu-trigger b:after { content:""; position:absolute; top:4px; width:100%; border-top:2px solid currentColor; }
    .hero { display:grid; grid-template-columns:1.1fr .9fr; align-items:center; max-width:1180px; min-height:calc(100vh - 84px); margin:auto; padding:60px 28px 100px; gap:60px; } .hero h1 { max-width:680px; margin:0 0 24px; font-size:clamp(54px,8vw,110px); line-height:.9; letter-spacing:-.09em; } .hero h1 em { color:var(--accent); font-style:normal; } .hero p { max-width:480px; color:var(--muted); font-size:19px; }
    .orb { display:grid; place-items:center; aspect-ratio:1; max-width:450px; margin:auto; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffad66, var(--accent) 43%, #a4362b 100%); box-shadow:20px 24px 0 #d8d1c2; color:#fff; font-size:clamp(50px,8vw,100px); font-weight:700; letter-spacing:-.1em; transform:rotate(-12deg); }
    .backdrop { position:fixed; z-index:20; inset:0; background:#10171099; opacity:0; visibility:hidden; transition:.3s; } .backdrop.open { opacity:1; visibility:visible; }
    .drawer { position:absolute; top:0; right:0; display:flex; flex-direction:column; width:min(520px,100%); height:100%; padding:32px clamp(24px,6vw,64px); color:#f9f7f0; background:#18221d; transform:translateX(100%); transition:.35s cubic-bezier(.7,0,.2,1); } .open .drawer { transform:translateX(0); }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #ffffff26; padding-bottom:23px; } .drawer-head small { color:#aab7ab; letter-spacing:.12em; text-transform:uppercase; } .close { border:0; color:#fff; background:transparent; font-size:30px; line-height:1; cursor:pointer; }
    .drawer nav { display:grid; margin-top:52px; } .drawer nav a { padding:17px 0; border-bottom:1px solid #ffffff1e; color:#fff; font-size:clamp(30px,5vw,48px); letter-spacing:-.06em; text-decoration:none; } .drawer nav a:hover { color:#ff9877; padding-left:10px; }
    .drawer-footer { margin-top:auto; color:#aab7ab; font-size:14px; } .drawer-footer strong { display:block; margin-bottom:5px; color:#fff; }
    @media (max-width:720px) { .hero { grid-template-columns:1fr; padding-top:35px; gap:30px; } .orb { width:72%; } }
  </style>
</head>
<body>
  <header class="top"><a class="wordmark" href="#">field<span>work</span></a><button class="menu-trigger" id="openMenu" type="button" aria-controls="drawer" aria-expanded="false"><b></b> Menu</button></header>
  <main class="hero"><div><h1>Ideas with <em>room</em> to grow.</h1><p>Fieldwork is an independent creative studio helping people build brands that feel as good as they work.</p></div><div class="orb" aria-hidden="true">fw</div></main>
  <div class="backdrop" id="menuLayer">
    <aside class="drawer" id="drawer" aria-label="Site menu" aria-hidden="true">
      <div class="drawer-head"><small>Explore fieldwork</small><button class="close" id="closeMenu" type="button" aria-label="Close menu">×</button></div>
      <nav><a href="#studio">Studio <span>↗</span></a><a href="#projects">Projects <span>↗</span></a><a href="#journal">Journal <span>↗</span></a><a href="#contact">Contact <span>↗</span></a></nav>
      <div class="drawer-footer"><strong>Say hello</strong>hello@fieldwork.example</div>
    </aside>
  </div>
  <script>
    const layer = document.querySelector("#menuLayer"), drawer = document.querySelector("#drawer"), opener = document.querySelector("#openMenu");
    function setMenu(open) { layer.classList.toggle("open", open); drawer.setAttribute("aria-hidden", !open); opener.setAttribute("aria-expanded", open); document.body.style.overflow = open ? "hidden" : ""; if (open) document.querySelector("#closeMenu").focus(); else opener.focus(); }
    opener.addEventListener("click", () => setMenu(true)); document.querySelector("#closeMenu").addEventListener("click", () => setMenu(false));
    layer.addEventListener("click", e => { if (e.target === layer) setMenu(false); }); document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.classList.contains("open")) setMenu(false); });
    drawer.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setMenu(false)));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Labels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f1f4f6; --surface:#fff; --ink:#17242d; --muted:#84919a; --line:#d8e0e5; --blue:#2876c8; --error:#d55765; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f1f4f6,#dfeaf3); font:15px/1.5 "Manrope",sans-serif; } button, input, textarea { font:inherit; }
    .card { width:min(570px,calc(100% - 36px)); padding:clamp(28px,6vw,48px); border:1px solid #fff; border-radius:22px; background:#ffffffec; box-shadow:0 26px 75px #3852691d; } h1 { margin:0 0 8px; font-size:33px; letter-spacing:-.07em; } .intro { margin:0 0 29px; color:var(--muted); } .grid { display:grid; grid-template-columns:1fr 1fr; gap:17px; } .field { position:relative; } .field.full { grid-column:1/-1; } input, textarea { display:block; width:100%; padding:17px 13px 8px; border:1px solid var(--line); border-radius:9px; outline:0; color:var(--ink); background:#fff; } textarea { min-height:128px; resize:vertical; } label { position:absolute; top:14px; left:13px; color:var(--muted); pointer-events:none; transition:.16s; } input:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #2876c81b; } input:focus + label, input:not(:placeholder-shown) + label, textarea:focus + label, textarea:not(:placeholder-shown) + label { top:5px; color:var(--blue); font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; } .field small { display:block; min-height:17px; margin:5px 3px 0; color:var(--error); font-size:12px; } .submit { width:100%; margin-top:20px; padding:13px; border:0; border-radius:9px; color:#fff; background:var(--blue); font-weight:700; cursor:pointer; } .message { margin-top:13px; color:#318766; text-align:center; }
    @media(max-width:520px) { .grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } }
  </style>
</head>
<body>
  <main class="card"><h1>Start a conversation</h1><p class="intro">Tell us what you are working on and we will get back to you soon.</p><form id="form" class="grid" novalidate><div class="field"><input id="first" placeholder=" " required><label for="first">First name</label><small></small></div><div class="field"><input id="last" placeholder=" " required><label for="last">Last name</label><small></small></div><div class="field full"><input id="email" type="email" placeholder=" " required><label for="email">Email address</label><small></small></div><div class="field full"><textarea id="message" placeholder=" " required></textarea><label for="message">How can we help?</label><small></small></div><div class="field full"><button class="submit" type="submit">Send message</button><div class="message" id="messageStatus" role="status"></div></div></form></main>
  <script>
    const form = document.querySelector("#form"); form.addEventListener("submit", e => { e.preventDefault(); let valid = true; form.querySelectorAll("[required]").forEach(field => { const error = field.parentElement.querySelector("small"); let message = ""; if (!field.value.trim()) message = "This field is required."; else if (field.type === "email" && !field.validity.valid) message = "Enter a valid email address."; error.textContent = message; field.setAttribute("aria-invalid", Boolean(message)); if (message) valid = false; }); if (valid) { document.querySelector("#messageStatus").textContent = "Thanks — your message is on its way."; form.querySelector("button").disabled = true; } });
  </script>
</body>
</html>

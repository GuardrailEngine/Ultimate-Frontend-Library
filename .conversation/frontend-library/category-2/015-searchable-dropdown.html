<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Searchable Dropdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d1118; --surface:#151c27; --surface-2:#202b3a; --line:#2c3a4d; --text:#f1f5fb; --muted:#8998ac; --accent:#55c5b5; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 10%,#193d45,transparent 40%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } button, input { font:inherit; }
    .card { width:min(500px,calc(100% - 36px)); padding:36px; border:1px solid var(--line); border-radius:21px; background:#151c27ed; box-shadow:0 24px 80px #0008; } .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:10px 0 8px; font-size:32px; letter-spacing:-.07em; } .intro { margin:0 0 27px; color:var(--muted); } .select { position:relative; } .trigger { display:flex; align-items:center; justify-content:space-between; width:100%; padding:13px 15px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:#0e141d; text-align:left; cursor:pointer; } .trigger:focus, .open .trigger { border-color:var(--accent); outline:0; box-shadow:0 0 0 3px #55c5b51f; } .trigger .selected { color:var(--text); } .trigger .placeholder { color:var(--muted); } .arrow { color:var(--muted); transition:.2s; } .open .arrow { transform:rotate(180deg); }
    .menu { position:absolute; z-index:3; top:calc(100% + 8px); right:0; left:0; overflow:hidden; border:1px solid var(--line); border-radius:11px; background:var(--surface); box-shadow:0 17px 40px #0008; opacity:0; visibility:hidden; transform:translateY(-5px); transition:.18s; } .open .menu { opacity:1; visibility:visible; transform:none; } .search { padding:10px; border-bottom:1px solid var(--line); } .search input { width:100%; padding:10px; border:1px solid var(--line); border-radius:7px; outline:0; color:var(--text); background:#0e141d; } .options { max-height:220px; overflow:auto; padding:6px; } .option { display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px; border:0; border-radius:7px; color:var(--text); background:transparent; text-align:left; cursor:pointer; } .option:hover, .option.highlighted { background:var(--surface-2); } .option small { color:var(--muted); } .no-results { padding:18px 10px; color:var(--muted); text-align:center; }
    .chosen { min-height:22px; margin-top:17px; color:var(--accent); font-size:13px; }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Workspace settings</span><h1>Choose a timezone</h1><p class="intro">We use this to make dates and reminders feel local.</p><div class="select" id="select"><button class="trigger" id="trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="placeholder">Search or choose a timezone</span><span class="arrow">⌄</span></button><div class="menu"><div class="search"><input id="search" type="search" placeholder="Filter timezones..." aria-label="Filter timezones"></div><div class="options" id="options" role="listbox"></div></div></div><div class="chosen" id="chosen" role="status"></div></main>
  <script>
    const zones = [["Casablanca","Africa/Casablanca"],["London","Europe/London"],["New York","America/New_York"],["Los Angeles","America/Los_Angeles"],["Paris","Europe/Paris"],["Singapore","Asia/Singapore"],["Tokyo","Asia/Tokyo"],["Sydney","Australia/Sydney"]], select = document.querySelector("#select"), trigger = document.querySelector("#trigger"), search = document.querySelector("#search"), options = document.querySelector("#options"), chosen = document.querySelector("#chosen"); let highlight = 0;
    function render() { const query = search.value.toLowerCase(); const filtered = zones.filter(z => z.join(" ").toLowerCase().includes(query)); highlight = Math.min(highlight, Math.max(0, filtered.length - 1)); options.innerHTML = filtered.length ? filtered.map((zone,i) => `<button class="option ${i === highlight ? "highlighted" : ""}" role="option" data-zone="${zone[0]}" type="button"><span>${zone[0]}</span><small>${zone[1]}</small></button>`).join("") : '<div class="no-results">No timezones found</div>'; options.querySelectorAll(".option").forEach(option => option.addEventListener("click", () => choose(option.dataset.zone))); }
    function open(opened) { select.classList.toggle("open", opened); trigger.setAttribute("aria-expanded", opened); if (opened) { search.value = ""; highlight = 0; render(); search.focus(); } }
    function choose(name) { trigger.querySelector("span").className = "selected"; trigger.querySelector("span").textContent = name; chosen.textContent = `Timezone set to ${name}.`; open(false); trigger.focus(); }
    trigger.addEventListener("click", () => open(!select.classList.contains("open"))); search.addEventListener("input", () => { highlight = 0; render(); }); search.addEventListener("keydown", e => { const items = options.querySelectorAll(".option"); if (e.key === "ArrowDown") { e.preventDefault(); highlight = Math.min(highlight + 1, items.length - 1); render(); } if (e.key === "ArrowUp") { e.preventDefault(); highlight = Math.max(highlight - 1, 0); render(); } if (e.key === "Enter" && items[highlight]) choose(items[highlight].dataset.zone); });
    document.addEventListener("click", e => { if (!select.contains(e.target)) open(false); }); document.addEventListener("keydown", e => { if (e.key === "Escape") open(false); }); render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#120c15; --surface:#201522; --line:#482b49; --text:#fff2fc; --muted:#ad8ca7; --pink:#ef72ba; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 30%,#542148,transparent 40%),var(--bg); font:15px/1.5 "Manrope",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--pink); font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:13px 0 9px; font-size:clamp(43px,7vw,78px); line-height:.94; letter-spacing:-.1em; } p { margin:0 auto 48px; color:var(--muted); font-size:17px; } .heart-button { display:grid; place-items:center; width:100px; height:100px; margin:auto; border:1px solid #ef72ba66; border-radius:50%; color:var(--pink); background:#ef72ba13; font-size:46px; cursor:pointer; animation:pulse 1.6s infinite; } .heart-button.liked { color:#fff; background:var(--pink); box-shadow:0 0 0 13px #ef72ba1a,0 0 45px #ef72ba66; } @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } } .heart-button:active { transform:scale(.9); } .count { min-height:24px; margin-top:23px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">A little human signal</span><h1>Let the feeling land.</h1><p>A pulse turns a tiny moment of appreciation into feedback people can feel.</p><button class="heart-button" id="heart" type="button" aria-label="Like this idea">♡</button><div class="count" id="count">42 people liked this</div></main>
  <script>
    const heart=document.querySelector("#heart"), count=document.querySelector("#count"); let liked=false, total=42; heart.addEventListener("click",()=>{liked=!liked;total+=liked?1:-1;heart.classList.toggle("liked",liked);heart.textContent=liked?"♥":"♡";heart.setAttribute("aria-label",liked?"Remove like":"Like this idea");count.textContent=`${total} people liked this`;});
  </script>
</body>
</html>

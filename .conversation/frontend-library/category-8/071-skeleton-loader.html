<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f7fa; --surface:#fff; --line:#e4e9ef; --shimmer:#eef2f6; --ink:#1d2733; --muted:#8793a1; --blue:#4a7fe0; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f7fa,#eaf0ff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(620px,calc(100% - 36px)); padding:25px; border:1px solid var(--line); border-radius:17px; background:var(--surface); box-shadow:0 20px 55px #30476a12; } .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; } h1 { margin:0; font-size:21px; letter-spacing:-.05em; } .refresh { padding:8px 11px; border:1px solid var(--line); border-radius:7px; color:var(--blue); background:transparent; cursor:pointer; font-weight:700; }
    .skeleton { display:grid; gap:17px; } .sk { position:relative; overflow:hidden; background:var(--shimmer); } .sk:after { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 20%,#fff9 45%,transparent 70%); transform:translateX(-100%); animation:shine 1.35s infinite; } @keyframes shine { to { transform:translateX(100%); } } .sk-row { display:grid; grid-template-columns:62px 1fr; gap:14px; align-items:center; } .circle { width:62px; height:62px; border-radius:50%; } .lines { display:grid; gap:9px; } .line { height:11px; border-radius:5px; } .line.short { width:38%; } .line.mid { width:65%; } .hero { height:150px; border-radius:11px; } .content-lines { display:grid; gap:11px; } .content-lines .line { height:13px; width:100%; } .content-lines .line:nth-child(2) { width:88%; } .content-lines .line:nth-child(3) { width:62%; } .real { display:none; } .loaded .skeleton { display:none; } .loaded .real { display:block; animation:appear .3s; } @keyframes appear { from { opacity:0; } to { opacity:1; } } .real .image { height:150px; border-radius:11px; background:linear-gradient(135deg,#526fd0,#72b6a5); } .real h2 { margin:16px 0 5px; font-size:21px; } .real p { margin:0; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card" id="card"><div class="top"><h1>Latest project</h1><button class="refresh" id="refresh" type="button">Reload</button></div><div class="skeleton" aria-label="Loading project"><div class="sk sk-row"><i class="sk circle"></i><div class="lines"><i class="sk line mid"></i><i class="sk line short"></i></div></div><i class="sk hero"></i><div class="content-lines"><i class="sk line"></i><i class="sk line"></i><i class="sk line"></i></div></div><div class="real"><div class="image"></div><h2>Northstar rebrand</h2><p>A new visual language for teams finding their next horizon.</p></div></main>
  <script>
    const card=document.querySelector("#card"), refresh=document.querySelector("#refresh"); function load(){card.classList.remove("loaded");refresh.disabled=true;refresh.textContent="Loading…";setTimeout(()=>{card.classList.add("loaded");refresh.disabled=false;refresh.textContent="Reload"},1400)} refresh.addEventListener("click",load); setTimeout(()=>card.classList.add("loaded"),1700);
  </script>
</body>
</html>

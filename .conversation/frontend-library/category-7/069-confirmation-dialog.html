<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation Dialog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#101116; --surface:#191d26; --line:#303846; --text:#f0f3fa; --muted:#8b96a8; --red:#f36b7f; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 70% 0,#452638,transparent 40%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } .page { text-align:center; } .eyebrow { color:var(--red); font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:12px 0 9px; font-size:clamp(42px,7vw,74px); line-height:.95; letter-spacing:-.1em; } .page p { margin:0 auto 35px; color:var(--muted); font-size:17px; } .danger { padding:12px 17px; border:1px solid var(--red); border-radius:8px; color:#fff; background:var(--red); cursor:pointer; font-weight:700; }
    .overlay { position:fixed; z-index:4; inset:0; display:grid; place-items:center; padding:20px; background:#000b; opacity:0; visibility:hidden; transition:.2s; } .overlay.open { opacity:1; visibility:visible; } .dialog { width:min(410px,100%); padding:27px; border:1px solid var(--line); border-radius:15px; background:var(--surface); box-shadow:0 20px 70px #000b; transform:scale(.95); transition:.2s; } .open .dialog { transform:none; } .icon { display:grid; place-items:center; width:42px; height:42px; margin-bottom:17px; border-radius:50%; color:var(--red); background:#f36b7f1b; font-size:20px; } h2 { margin:0 0 8px; font-size:23px; letter-spacing:-.06em; } .dialog p { margin:0 0 22px; color:var(--muted); } .actions { display:flex; justify-content:flex-end; gap:8px; } .actions button { padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:700; } .cancel { border:1px solid var(--line); color:var(--text); background:transparent; } .confirm { border:1px solid var(--red); color:#fff; background:var(--red); }
  </style>
</head>
<body>
  <main class="page"><span class="eyebrow">A reversible decision</span><h1>Make the consequence clear.</h1><p>Confirmation dialogs should explain what will happen, then make the safe path easy to choose.</p><button class="danger" id="delete" type="button">Delete draft</button></main><div class="overlay" id="overlay"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="title"><div class="icon">!</div><h2 id="title">Delete this draft?</h2><p>This will permanently remove “Spring launch” and all of its comments. This cannot be undone.</p><div class="actions"><button class="cancel" id="cancel" type="button">Keep draft</button><button class="confirm" id="confirm" type="button">Delete permanently</button></div></section></div>
  <script>
    const overlay=document.querySelector("#overlay"), trigger=document.querySelector("#delete"); function close(){overlay.classList.remove("open");trigger.focus();} trigger.addEventListener("click",()=>{overlay.classList.add("open");document.querySelector("#cancel").focus()}); document.querySelector("#cancel").addEventListener("click",close); document.querySelector("#confirm").addEventListener("click",()=>{close();trigger.textContent="Draft deleted";trigger.disabled=true;}); overlay.addEventListener("click",e=>{if(e.target===overlay)close()}); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))close()});
  </script>
</body>
</html>

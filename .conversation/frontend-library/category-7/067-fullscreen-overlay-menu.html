<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Overlay Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#efe9dd; --ink:#19211c; --green:#245b43; --orange:#ec7147; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.5 "Space Grotesk",sans-serif; } header { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; width:min(1100px,100%); height:82px; margin:auto; padding:0 28px; } .logo { font-size:20px; font-weight:700; letter-spacing:-.07em; } .logo span { color:var(--orange); } .menu-button { display:flex; align-items:center; gap:9px; padding:10px 13px; border:1px solid var(--ink); border-radius:99px; color:var(--ink); background:transparent; cursor:pointer; } .menu-button i { display:block; width:17px; height:12px; border-top:2px solid; border-bottom:2px solid; position:relative; } .menu-button i:after { content:""; position:absolute; top:4px; width:100%; border-top:2px solid; } .hero { display:grid; align-items:center; min-height:calc(100vh - 82px); width:min(1100px,100%); margin:auto; padding:50px 28px; } .hero h1 { max-width:780px; margin:0; font-size:clamp(52px,9vw,120px); line-height:.88; letter-spacing:-.12em; } .hero h1 span { color:var(--orange); } .overlay { position:fixed; z-index:4; inset:0; display:grid; grid-template-columns:1.1fr .9fr; padding:110px max(28px,calc((100% - 1100px)/2)); color:#eaf5ed; background:var(--green); opacity:0; visibility:hidden; transition:.35s; } .overlay.open { opacity:1; visibility:visible; } .overlay nav { display:grid; align-content:start; } .overlay nav a { padding:7px 0; color:#eaf5ed; font-size:clamp(43px,7vw,85px); line-height:1; letter-spacing:-.09em; text-decoration:none; transform:translateY(20px); opacity:0; transition:.3s; } .overlay.open nav a { transform:none; opacity:1; } .overlay.open nav a:nth-child(2) { transition-delay:.05s; } .overlay.open nav a:nth-child(3) { transition-delay:.1s; } .overlay.open nav a:nth-child(4) { transition-delay:.15s; } .overlay nav a:hover { color:#f3a17f; } .close { position:absolute; top:28px; right:28px; border:0; color:#eaf5ed; background:transparent; font-size:33px; cursor:pointer; } .overlay-info { align-self:end; padding-bottom:10px; color:#a6c4b0; } .overlay-info strong { display:block; margin-bottom:6px; color:#fff; }
    @media(max-width:680px) { .overlay { display:block; padding:110px 28px 30px; } .overlay-info { position:absolute; bottom:30px; } }
  </style>
</head>
<body>
  <header><div class="logo">open<span>/</span>field</div><button class="menu-button" id="open" type="button" aria-expanded="false"><i></i> Menu</button></header><main class="hero"><h1>Make room for<br><span>something better.</span></h1></main><div class="overlay" id="overlay"><button class="close" id="close" type="button" aria-label="Close menu">×</button><nav><a href="#work">Work ↗</a><a href="#studio">Studio ↗</a><a href="#journal">Journal ↗</a><a href="#contact">Contact ↗</a></nav><div class="overlay-info"><strong>Openfield studio</strong>Independent design and technology<br>hello@openfield.example</div></div>
  <script>
    const overlay=document.querySelector("#overlay"), open=document.querySelector("#open"); function toggle(value){overlay.classList.toggle("open",value); open.setAttribute("aria-expanded",value); document.body.style.overflow=value?"hidden":""; if(value)document.querySelector(".overlay nav a").focus();else open.focus();} open.addEventListener("click",()=>toggle(true)); document.querySelector("#close").addEventListener("click",()=>toggle(false)); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))toggle(false)});
  </script>
</body>
</html>

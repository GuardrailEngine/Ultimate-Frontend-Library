<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radial Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#090e13; --surface:#121a21; --line:#26343e; --text:#eff9f3; --muted:#84968c; --green:#77e1a9; --blue:#69a9ff; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 0,#194535,transparent 42%),var(--bg); font:15px/1.5 "Space Grotesk",sans-serif; } .card { width:min(740px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:21px; background:#121a21ed; box-shadow:0 25px 75px #0009; } .top { display:flex; justify-content:space-between; align-items:start; } .eyebrow { color:var(--green); font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:9px 0 4px; font-size:31px; letter-spacing:-.08em; } .sub { margin:0; color:var(--muted); } .refresh { padding:8px 12px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:transparent; cursor:pointer; }
    .content { display:grid; grid-template-columns:250px 1fr; align-items:center; gap:50px; margin-top:35px; } .ring { position:relative; display:grid; place-items:center; width:230px; aspect-ratio:1; margin:auto; border-radius:50%; background:conic-gradient(var(--green) 0 78%,#26343e 78% 100%); transform:rotate(-90deg); } .ring:after { content:""; position:absolute; inset:14px; border-radius:50%; background:var(--surface); } .center { position:relative; z-index:1; transform:rotate(90deg); text-align:center; } .center strong { display:block; font-size:42px; letter-spacing:-.09em; } .center span { color:var(--muted); font-size:12px; } .details { display:grid; gap:18px; } .detail { display:flex; align-items:center; justify-content:space-between; padding-bottom:15px; border-bottom:1px solid var(--line); } .detail span { color:var(--muted); } .detail b { font-size:17px; } .detail b.green { color:var(--green); } .note { margin-top:21px; color:var(--muted); font-size:13px; }
    @media(max-width:620px) { .content { grid-template-columns:1fr; gap:30px; } .ring { width:200px; } }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Team goal</span><h1>Launch readiness</h1><p class="sub">All the pieces needed for release</p></div><button class="refresh" id="refresh" type="button">Refresh ↻</button></div><div class="content"><div class="ring" id="ring" role="img" aria-label="78 percent complete"><div class="center"><strong id="percent">78%</strong><span>complete</span></div></div><div class="details"><div class="detail"><span>Product requirements</span><b class="green">Done</b></div><div class="detail"><span>Quality assurance</span><b>14 / 18</b></div><div class="detail"><span>Release checklist</span><b>9 / 12</b></div><p class="note">You are 6 tasks away from a confident launch.</p></div></div></main>
  <script>
    const ring = document.querySelector("#ring"), percent = document.querySelector("#percent"), refresh = document.querySelector("#refresh"); refresh.addEventListener("click", () => { const value = Math.floor(75 + Math.random() * 10); ring.style.background = `conic-gradient(var(--green) 0 ${value}%,#26343e ${value}% 100%)`; ring.setAttribute("aria-label", `${value} percent complete`); percent.textContent = `${value}%`; refresh.textContent = "Updated ✓"; setTimeout(() => refresh.textContent = "Refresh ↻",1500); });
  </script>
</body>
</html>

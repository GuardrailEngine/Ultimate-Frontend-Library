<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0e16; --surface:#141a28; --line:#2b3850; --text:#eff3fd; --muted:#8794a9; --purple:#9d83ff; --cyan:#62d7d3; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 75% 10%,#2c2855,transparent 40%),var(--bg); font:14px/1.5 "Space Grotesk",sans-serif; } .card { width:min(820px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:21px; background:#141a28ed; box-shadow:0 25px 75px #0009; } .top { display:flex; justify-content:space-between; align-items:start; } .eyebrow { color:var(--cyan); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:9px 0 4px; font-size:31px; letter-spacing:-.08em; } .sub { margin:0; color:var(--muted); } .toggle { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:8px; } .toggle button { padding:6px 9px; border:0; border-radius:5px; color:var(--muted); background:transparent; cursor:pointer; font-size:12px; } .toggle button.active { color:var(--text); background:var(--line); }
    .chart { margin:24px auto 0; max-width:560px; } svg { display:block; width:100%; height:auto; overflow:visible; } .grid { fill:none; stroke:var(--line); stroke-width:1; } .axis { stroke:var(--line); stroke-width:1; } .area { fill:var(--purple); fill-opacity:.2; stroke:var(--purple); stroke-width:2.5; transition:d .4s; } .point { fill:var(--purple); stroke:var(--surface); stroke-width:2; } .label { fill:var(--muted); font-size:12px; } .legend { display:flex; justify-content:center; gap:20px; margin-top:4px; color:var(--muted); font-size:12px; } .legend i { display:inline-block; width:8px; height:8px; margin-right:5px; border-radius:50%; background:var(--purple); }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Team health</span><h1>Strengths in balance</h1><p class="sub">How the team is feeling across six dimensions</p></div><div class="toggle"><button class="active" data-mode="current" type="button">Current</button><button data-mode="goal" type="button">Goal</button></div></div><div class="chart"><svg id="radar" viewBox="0 0 560 420" role="img" aria-label="Radar chart of team health"><g id="chartGroup"></g></svg></div><div class="legend"><span><i></i>Team health score</span></div></main>
  <script>
    const names=["Focus","Clarity","Trust","Pace","Craft","Learning"], current=[78,65,83,58,72,88], goal=[90,85,90,82,88,92], center={x:280,y:205}, radius=145, group=document.querySelector("#chartGroup"), ns="http://www.w3.org/2000/svg";
    function point(value,i,r=radius) { const angle = -Math.PI/2 + i * Math.PI*2/names.length; return {x:center.x+Math.cos(angle)*r*value/100,y:center.y+Math.sin(angle)*r*value/100}; } function poly(points) { return points.map(p=>`${p.x},${p.y}`).join(" "); }
    const outer=names.map((_,i)=>point(100,i)), rings=[25,50,75,100]; group.innerHTML = rings.map(value=>`<polygon class="grid" points="${poly(names.map((_,i)=>point(value,i)))}"/>`).join("") + names.map((_,i)=>{ const p=point(100,i); return `<line class="axis" x1="${center.x}" y1="${center.y}" x2="${p.x}" y2="${p.y}"/>`; }).join("") + names.map((name,i)=>{ const p=point(120,i); return `<text class="label" x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle">${name}</text>`; }).join("");
    const area=document.createElementNS(ns,"polygon"); area.classList.add("area"); area.setAttribute("points",poly(current.map((v,i)=>point(v,i)))); group.append(area); current.forEach((v,i)=>{ const p=point(v,i), dot=document.createElementNS(ns,"circle"); dot.classList.add("point"); dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y); dot.setAttribute("r",4); group.append(dot); });
    document.querySelectorAll(".toggle button").forEach(button=>button.addEventListener("click",()=>{ document.querySelectorAll(".toggle button").forEach(b=>b.classList.remove("active")); button.classList.add("active"); const data=button.dataset.mode==="goal"?goal:current; area.setAttribute("points",poly(data.map((v,i)=>point(v,i)))); group.querySelectorAll(".point").forEach((dot,i)=>{ const p=point(data[i],i); dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y); }); }));
  </script>
</body>
</html>

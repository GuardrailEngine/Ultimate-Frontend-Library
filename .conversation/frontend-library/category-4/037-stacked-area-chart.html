<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked Area Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d111a; --surface:#151c29; --line:#29364b; --text:#eff3fb; --muted:#8996a9; --one:#6ed7cb; --two:#8d78f7; --three:#f0a567; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 20% 0,#1e3141,transparent 40%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(900px,calc(100% - 36px)); padding:34px; border:1px solid var(--line); border-radius:20px; background:#151c29ed; box-shadow:0 25px 75px #0009; } .top { display:flex; align-items:start; justify-content:space-between; } .eyebrow { color:var(--one); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 4px; font-size:30px; letter-spacing:-.07em; } .sub { margin:0; color:var(--muted); } .select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:transparent; }
    .chart { margin-top:30px; } svg { display:block; width:100%; height:auto; } .grid { stroke:var(--line); stroke-width:1; } .axis { fill:var(--muted); font-size:11px; } .area { transition:opacity .2s; cursor:pointer; } .area:hover { opacity:.85; } .tooltip { position:fixed; z-index:3; padding:8px 10px; border-radius:7px; color:#fff; background:#273248; font-size:12px; pointer-events:none; opacity:0; transition:opacity .15s; } .legend { display:flex; gap:20px; margin-top:15px; color:var(--muted); font-size:12px; } .legend i { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:2px; }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Usage overview</span><h1>Where time goes</h1><p class="sub">Hours tracked by workstream this quarter</p></div><button class="select" id="select" type="button">Q3 2026⌄</button></div><div class="chart"><svg viewBox="0 0 820 330" id="chart" role="img" aria-label="Stacked area chart showing hours by workstream"><g id="grid"></g><path class="area" data-name="Product" fill="var(--one)" opacity=".8"></path><path class="area" data-name="Growth" fill="var(--two)" opacity=".8"></path><path class="area" data-name="Operations" fill="var(--three)" opacity=".8"></path><g id="labels"></g></svg></div><div class="legend"><span><i style="background:var(--one)"></i>Product</span><span><i style="background:var(--two)"></i>Growth</span><span><i style="background:var(--three)"></i>Operations</span></div></main><div class="tooltip" id="tooltip"></div>
  <script>
    const series = [[40,44,47,50,58,62,69,74],[26,30,33,38,42,46,50,54],[15,18,20,19,25,29,27,34]], labels=["May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], chart=document.querySelector("#chart"), grid=document.querySelector("#grid"), labelGroup=document.querySelector("#labels"), paths=document.querySelectorAll(".area"), tooltip=document.querySelector("#tooltip"), x=i=>55+i*710/7, y=v=>275-v*2.8;
    [0,25,50,75,100].forEach(v => grid.insertAdjacentHTML("beforeend",`<line class="grid" x1="55" x2="765" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="10" y="${y(v)+4}">${v}h</text>`)); labelGroup.innerHTML=labels.map((label,i)=>`<text class="axis" x="${x(i)}" y="310" text-anchor="middle">${label}</text>`).join("");
    let cumulative=Array(8).fill(0); [...paths].reverse().forEach((path,reverseIndex)=>{ const idx=2-reverseIndex, lower=[...cumulative]; cumulative=cumulative.map((v,i)=>v+series[idx][i]); const upper=cumulative; path.setAttribute("d",`${upper.map((v,i)=>`${i?"L":"M"} ${x(i)} ${y(v)}`).join(" ")} ${lower.map((v,i)=>`L ${x(7-i)} ${y(v)}`).join(" ")} Z`); path.addEventListener("mouseenter", e=>{ tooltip.textContent=`${path.dataset.name}: ${cumulative[4]-lower[4]} hours in Sep`; tooltip.style.left=`${e.clientX+10}px`; tooltip.style.top=`${e.clientY-38}px`; tooltip.style.opacity="1"; }); path.addEventListener("mouseleave",()=>tooltip.style.opacity="0"); });
    document.querySelector("#select").addEventListener("click", e => { e.currentTarget.textContent = e.currentTarget.textContent.startsWith("Q3") ? "Q2 2026⌄" : "Q3 2026⌄"; });
  </script>
</body>
</html>

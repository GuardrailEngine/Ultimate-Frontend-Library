<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Gauge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#071318; --surface:#0f2028; --line:#1c3c48; --text:#e9faf7; --muted:#82a39f; --teal:#46dbc1; --blue:#3496ea; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 0,#14515b,transparent 40%),var(--bg); font:15px/1.5 "Manrope",sans-serif; } .card { width:min(620px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:21px; background:#0f2028eb; box-shadow:0 25px 75px #0009; text-align:center; } .eyebrow { color:var(--teal); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:9px 0 7px; font-size:32px; letter-spacing:-.08em; } .sub { margin:0; color:var(--muted); }
    .gauge { position:relative; isolation:isolate; width:220px; height:220px; margin:35px auto 22px; overflow:hidden; border:5px solid #1e4250; border-radius:50%; background:#0c2630; box-shadow:inset 0 0 30px #0008,0 0 30px #46dbc12b; } .wave { position:absolute; right:-45%; bottom:calc(var(--fill) - 8%); left:-45%; height:170%; border-radius:43%; background:linear-gradient(180deg,var(--teal),var(--blue)); animation:wave 4s ease-in-out infinite; } .wave:after { content:""; position:absolute; top:0; right:0; left:0; height:15px; border-radius:50%; background:#9cfff0aa; } @keyframes wave { 50% { transform:translateX(7%) rotate(3deg); } } .value { position:absolute; z-index:1; inset:0; display:grid; place-items:center; align-content:center; text-shadow:0 2px 8px #0015; } .value strong { font-size:43px; letter-spacing:-.08em; } .value span { color:#d3fffa; font-size:12px; } .detail { display:flex; justify-content:space-between; max-width:310px; margin:auto; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; } .detail b { color:var(--teal); }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Cloud storage</span><h1>Capacity is looking healthy.</h1><p class="sub">Your team's shared space is comfortably below the limit.</p><div class="gauge" id="gauge"><div class="wave" style="--fill:38%"></div><div class="value"><strong>38%</strong><span>used</span></div></div><div class="detail"><span>1.9 TB available</span><b>of 3 TB</b></div></main>
</body>
</html>

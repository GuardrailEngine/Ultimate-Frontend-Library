<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bar Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d1115; --surface:#151b21; --line:#27323b; --text:#edf5f1; --muted:#899991; --lime:#c8ef65; --cyan:#61d5bd; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 70% 20%,#253b22,transparent 38%),var(--bg); font:14px/1.5 "Manrope",sans-serif; } .card { width:min(800px,calc(100% - 36px)); padding:34px; border:1px solid var(--line); border-radius:20px; background:#151b21ed; box-shadow:0 25px 75px #0008; } .top { display:flex; justify-content:space-between; align-items:start; } .eyebrow { color:var(--lime); font-size:12px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 4px; font-size:30px; letter-spacing:-.07em; } .sub { margin:0; color:var(--muted); } .total { text-align:right; } .total strong { display:block; font-size:28px; } .total span { color:var(--cyan); font-size:12px; }
    .chart { display:grid; grid-template-columns:34px 1fr; gap:10px; height:300px; margin-top:34px; } .y-axis { display:flex; flex-direction:column; justify-content:space-between; padding:0 0 25px; color:var(--muted); font-size:11px; text-align:right; } .plot { position:relative; display:flex; align-items:end; justify-content:space-around; gap:12px; padding:0 12px 25px; background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(25% - 1px),var(--line) 25%); border-bottom:1px solid var(--line); } .bar-group { display:flex; flex:1; height:100%; align-items:end; justify-content:center; gap:7px; } .bar { position:relative; width:min(38px,45%); height:calc(var(--value) * 1%); border-radius:7px 7px 2px 2px; background:linear-gradient(to top,var(--cyan),var(--lime)); transform-origin:bottom; animation:grow .7s cubic-bezier(.2,.8,.2,1) both; cursor:pointer; } .bar:nth-child(2) { background:linear-gradient(to top,#477af0,#9e83ff); animation-delay:.08s; } .bar:hover { filter:brightness(1.2); } .bar:after { content:attr(data-value); position:absolute; top:-24px; left:50%; color:var(--text); font-size:11px; opacity:0; transform:translateX(-50%); transition:.15s; } .bar:hover:after { opacity:1; } @keyframes grow { from { transform:scaleY(0); } to { transform:scaleY(1); } } .x-labels { position:absolute; right:0; bottom:3px; left:0; display:flex; justify-content:space-around; color:var(--muted); font-size:11px; } .legend { display:flex; gap:18px; margin:20px 0 0 44px; color:var(--muted); font-size:12px; } .legend i { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:2px; background:var(--cyan); }
    @media(max-width:540px) { .card { padding:24px 18px; } .bar-group { gap:3px; } .legend { margin-left:36px; } }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Monthly comparison</span><h1>New conversations</h1><p class="sub">Organic vs. paid acquisition</p></div><div class="total"><strong>1,284</strong><span>↗ 18.2%</span></div></div><div class="chart"><div class="y-axis"><span>400</span><span>300</span><span>200</span><span>100</span><span>0</span></div><div class="plot"><div class="bar-group"><i class="bar" style="--value:52" data-value="208"></i><i class="bar" style="--value:35" data-value="140"></i></div><div class="bar-group"><i class="bar" style="--value:68" data-value="272"></i><i class="bar" style="--value:47" data-value="188"></i></div><div class="bar-group"><i class="bar" style="--value:61" data-value="244"></i><i class="bar" style="--value:58" data-value="232"></i></div><div class="bar-group"><i class="bar" style="--value:76" data-value="304"></i><i class="bar" style="--value:46" data-value="184"></i></div><div class="bar-group"><i class="bar" style="--value:84" data-value="336"></i><i class="bar" style="--value:52" data-value="208"></i></div><div class="x-labels"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span></div></div></div><div class="legend"><span><i></i>Organic</span><span><i style="background:#735cf2"></i>Paid</span></div></main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Size Selector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f3ee; --surface:#fff; --ink:#1b241f; --muted:#7c867e; --line:#e2dfd7; --orange:#c86d47; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0,#f3d3b5,transparent 35%),var(--bg); font:14px/1.5 "Manrope",sans-serif; } .product { display:grid; grid-template-columns:1fr 1fr; width:min(720px,calc(100% - 36px)); overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 20px 55px #5c493c12; } .photo { display:grid; place-items:center; min-height:440px; color:#ffffffaa; background:linear-gradient(145deg,#df9874,#6d4544); font-size:40px; } .info { padding:34px; } .category { color:var(--orange); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:9px 0 7px; font-size:30px; line-height:1; letter-spacing:-.08em; } .description { margin:0 0 25px; color:var(--muted); } .price { margin-bottom:25px; font-size:24px; font-weight:800; } .option { margin-top:21px; } .option-head { display:flex; justify-content:space-between; margin-bottom:9px; font-size:12px; font-weight:700; } .option-head span { color:var(--muted); font-weight:400; } .colors { display:flex; gap:10px; } .color { width:27px; height:27px; border:3px solid var(--surface); border-radius:50%; outline:1px solid transparent; cursor:pointer; } .color.active { outline-color:var(--orange); } .sizes { display:flex; gap:7px; } .size { width:42px; padding:8px 0; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:var(--surface); cursor:pointer; } .size.active { border-color:var(--ink); color:var(--ink); background:#f4f1eb; font-weight:700; } .add { width:100%; margin-top:28px; padding:12px; border:0; border-radius:8px; color:#fff; background:var(--orange); cursor:pointer; font-weight:700; } .add:disabled { opacity:.5; cursor:not-allowed; } .selection { min-height:18px; margin-top:11px; color:var(--orange); font-size:12px; }
    @media(max-width:620px) { .product { grid-template-columns:1fr; } .photo { min-height:260px; } .info { padding:26px; } }
  </style>
</head>
<body>
  <article class="product"><div class="photo" id="photo">01</div><div class="info"><span class="category">Everyday essentials</span><h1>Arc lounge chair</h1><p class="description">An easy, generous seat for reading, resting, and doing absolutely nothing.</p><div class="price">$420</div><div class="option"><div class="option-head">Color <span id="colorLabel">Terracotta</span></div><div class="colors"><button class="color active" data-color="Terracotta" style="background:#b96445" type="button" aria-label="Terracotta"></button><button class="color" data-color="Moss" style="background:#829077" type="button" aria-label="Moss"></button><button class="color" data-color="Ink" style="background:#29333a" type="button" aria-label="Ink"></button></div></div><div class="option"><div class="option-head">Size <span id="sizeLabel">Choose a size</span></div><div class="sizes"><button class="size" data-size="Small" type="button">S</button><button class="size" data-size="Medium" type="button">M</button><button class="size" data-size="Large" type="button">L</button></div></div><button class="add" id="add" type="button" disabled>Choose a size</button><div class="selection" id="selection"></div></div></article>
  <script>
    const colors=document.querySelectorAll(".color"),sizes=document.querySelectorAll(".size"),colorLabel=document.querySelector("#colorLabel"),sizeLabel=document.querySelector("#sizeLabel"),add=document.querySelector("#add"),selection=document.querySelector("#selection");let color="Terracotta",size="";colors.forEach(button=>button.addEventListener("click",()=>{colors.forEach(item=>item.classList.remove("active"));button.classList.add("active");color=button.dataset.color;colorLabel.textContent=color;document.querySelector("#photo").style.background=button.dataset.color==="Moss"?"linear-gradient(145deg,#aaba9c,#40594e)":button.dataset.color==="Ink"?"linear-gradient(145deg,#69777d,#202a32)":"linear-gradient(145deg,#df9874,#6d4544)"}));sizes.forEach(button=>button.addEventListener("click",()=>{sizes.forEach(item=>item.classList.remove("active"));button.classList.add("active");size=button.dataset.size;sizeLabel.textContent=size;add.disabled=false;add.textContent="Add to bag"}));add.addEventListener("click",()=>{add.textContent="Added to bag ✓";add.disabled=true;selection.textContent=`${color} · ${size}`});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Dropdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f4ef; --surface:#fff; --ink:#1d2521; --muted:#7f8982; --line:#e3e1d9; --orange:#c86b42; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 80% 0,#f4dbbf,transparent 35%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } header { display:flex; justify-content:space-between; align-items:center; width:min(1000px,calc(100% - 36px)); height:80px; margin:auto; } .logo { font-size:20px; font-weight:700; letter-spacing:-.07em; } .logo span { color:var(--orange); } .cart-trigger { position:relative; padding:10px 13px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--surface); cursor:pointer; font-weight:700; } .count { position:absolute; top:-8px; right:-8px; display:grid; place-items:center; width:20px; height:20px; border-radius:50%; color:#fff; background:var(--orange); font-size:11px; } .hero { display:grid; place-items:center; min-height:calc(100vh - 80px); text-align:center; } .hero h1 { max-width:700px; margin:0; font-size:clamp(55px,9vw,105px); line-height:.9; letter-spacing:-.12em; } .hero p { color:var(--muted); font-size:18px; }
    .cart { position:absolute; z-index:3; top:70px; right:0; width:min(375px,calc(100vw - 28px)); padding:18px; border:1px solid var(--line); border-radius:13px; background:var(--surface); box-shadow:0 18px 48px #5744321a; opacity:0; visibility:hidden; transform:translateY(-7px); transition:.2s; } .cart.open { opacity:1; visibility:visible; transform:none; } .cart-head { display:flex; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--line); } .cart-head strong { font-size:17px; } .cart-head span { color:var(--muted); font-size:12px; } .item { display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:11px; padding:13px 0; } .thumb { width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg,#d49370,#5c4645); } .item strong { display:block; font-size:13px; } .item small { color:var(--muted); } .remove { border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:17px; } .total { display:flex; justify-content:space-between; padding-top:13px; border-top:1px solid var(--line); } .checkout { width:100%; margin-top:14px; padding:11px; border:0; border-radius:8px; color:#fff; background:var(--orange); cursor:pointer; font-weight:700; } .empty { padding:25px 0; color:var(--muted); text-align:center; }
  </style>
</head>
<body>
  <header><div class="logo">atelier<span>/</span>goods</div><div style="position:relative"><button class="cart-trigger" id="trigger" type="button" aria-expanded="false">Bag <span class="count" id="count">2</span></button><aside class="cart" id="cart" aria-label="Shopping cart"><div class="cart-head"><strong>Your bag</strong><span id="itemsLabel">2 items</span></div><div id="items"><div class="item"><div class="thumb"></div><div><strong>Solace lamp</strong><small>$148 · 1</small></div><button class="remove" type="button" aria-label="Remove Solace lamp">×</button></div><div class="item"><div class="thumb" style="background:linear-gradient(135deg,#7b9ba0,#324b53)"></div><div><strong>Clay vessel</strong><small>$64 · 1</small></div><button class="remove" type="button" aria-label="Remove Clay vessel">×</button></div></div><div class="total"><span>Total</span><strong id="total">$212</strong></div><button class="checkout" id="checkout" type="button">Checkout</button></aside></div></header><main class="hero"><div><h1>Objects for a softer everyday.</h1><p>Thoughtful forms for the places where life actually happens.</p></div></main>
  <script>
    const trigger=document.querySelector("#trigger"),cart=document.querySelector("#cart"),items=document.querySelector("#items"),count=document.querySelector("#count"),label=document.querySelector("#itemsLabel"),total=document.querySelector("#total"); trigger.addEventListener("click",()=>{const open=cart.classList.toggle("open");trigger.setAttribute("aria-expanded",open)}); function update(){const rows=[...items.querySelectorAll(".item")];count.textContent=rows.length;label.textContent=`${rows.length} item${rows.length===1?"":"s"}`;if(!rows.length){items.innerHTML='<div class="empty">Your bag is empty.</div>';total.textContent="$0";return}total.textContent=`$${rows.reduce((sum,row)=>sum+Number(row.querySelector("small").textContent.match(/\d+/)[0]),0)}`} items.addEventListener("click",e=>{if(e.target.classList.contains("remove")){e.target.closest(".item").remove();update()}});document.querySelector("#checkout").addEventListener("click",e=>{e.currentTarget.textContent="Checkout ready ✓";});
  </script>
</body>
</html>

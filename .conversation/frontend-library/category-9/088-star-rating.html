<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Rating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f7fa; --surface:#fff; --ink:#1d2734; --muted:#84909e; --line:#e0e6ee; --yellow:#f0b84e; --blue:#4b7fe0; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f6f7fa,#e9edff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(470px,calc(100% - 36px)); padding:31px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 20px 55px #34487512; text-align:center; } .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 7px; font-size:28px; letter-spacing:-.07em; } .intro { margin:0 0 26px; color:var(--muted); } .stars { display:inline-flex; gap:5px; } .star { border:0; color:#d7dde7; background:transparent; cursor:pointer; font-size:34px; transition:.12s; } .star:hover, .star.active { color:var(--yellow); transform:scale(1.12); } .rating { min-height:23px; margin-top:10px; color:var(--muted); font-size:13px; } textarea { width:100%; min-height:90px; margin-top:19px; padding:11px; border:1px solid var(--line); border-radius:8px; outline:0; resize:vertical; } textarea:focus { border-color:var(--blue); } .submit { width:100%; margin-top:12px; padding:11px; border:0; border-radius:8px; color:#fff; background:var(--blue); cursor:pointer; font-weight:700; } .submit:disabled { opacity:.4; cursor:not-allowed; } .success { min-height:20px; margin-top:11px; color:#2caa78; font-size:12px; }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Your experience matters</span><h1>How was your order?</h1><p class="intro">A quick rating helps us make the next one better.</p><div class="stars" role="radiogroup" aria-label="Rating from one to five"><button class="star" data-value="1" type="button" aria-label="1 star">★</button><button class="star" data-value="2" type="button" aria-label="2 stars">★</button><button class="star" data-value="3" type="button" aria-label="3 stars">★</button><button class="star" data-value="4" type="button" aria-label="4 stars">★</button><button class="star" data-value="5" type="button" aria-label="5 stars">★</button></div><div class="rating" id="rating">Choose a rating</div><textarea id="comment" placeholder="Tell us a little more (optional)"></textarea><button class="submit" id="submit" type="button" disabled>Send review</button><div class="success" id="success" role="status"></div></main>
  <script>
    const stars=[...document.querySelectorAll(".star")],rating=document.querySelector("#rating"),submit=document.querySelector("#submit"),labels=["Not for me","Could be better","It was okay","Really good","Loved it"];let chosen=0;stars.forEach((star,i)=>star.addEventListener("mouseenter",()=>stars.forEach((item,n)=>item.classList.toggle("active",n<=i))));document.querySelector(".stars").addEventListener("mouseleave",()=>stars.forEach((item,n)=>item.classList.toggle("active",n<chosen)));stars.forEach((star,i)=>star.addEventListener("click",()=>{chosen=i+1;rating.textContent=`${chosen}/5 · ${labels[i]}`;submit.disabled=false;stars.forEach((item,n)=>item.classList.toggle("active",n<i+1))}));submit.addEventListener("click",()=>{submit.textContent="Review sent ✓";submit.disabled=true;document.querySelector("#success").textContent="Thanks for helping us improve.";});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Cart Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6fa; --surface:#fff; --ink:#1b2532; --muted:#8591a0; --line:#dfe6ee; --purple:#7659e8; --pink:#ee79b9; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 50% 0,#ded7ff,transparent 40%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } .page { width:min(800px,calc(100% - 36px)); margin:8vh auto; } .eyebrow { color:var(--purple); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 9px; font-size:clamp(43px,7vw,75px); line-height:.95; letter-spacing:-.1em; } .page p { margin:0; color:var(--muted); font-size:17px; } .product-list { display:grid; grid-template-columns:repeat(2,1fr); gap:13px; margin-top:45px; } .product { padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); } .image { display:grid; place-items:center; height:180px; border-radius:9px; color:#fff9; background:linear-gradient(145deg,#9285d9,#4a4a86); font-size:24px; } .product h2 { margin:13px 3px 3px; font-size:16px; } .product p { margin:0 3px; font-size:12px; } .add { width:100%; margin-top:12px; padding:9px; border:1px solid var(--line); border-radius:7px; color:var(--purple); background:transparent; cursor:pointer; font-weight:700; } .add:hover { background:#f2efff; }
    .floating { position:fixed; right:25px; bottom:25px; display:flex; align-items:center; gap:13px; padding:11px 15px 11px 13px; border:0; border-radius:99px; color:#fff; background:var(--purple); box-shadow:0 10px 30px #7659e855; cursor:pointer; font-weight:700; transition:.2s; } .floating:hover { transform:translateY(-3px); } .bag-icon { display:grid; place-items:center; width:33px; height:33px; border-radius:50%; color:var(--purple); background:#fff; } .badge { position:absolute; top:-4px; left:37px; display:grid; place-items:center; width:20px; height:20px; border:2px solid var(--purple); border-radius:50%; color:#fff; background:var(--pink); font-size:10px; } .toast { position:fixed; right:25px; bottom:85px; padding:11px 14px; border:1px solid #c9bfff; border-radius:8px; color:var(--purple); background:#fff; opacity:0; transform:translateY(7px); transition:.2s; } .toast.show { opacity:1; transform:none; }
    @media(max-width:500px) { .product-list { grid-template-columns:1fr; } .floating { right:16px; bottom:16px; } .toast { right:16px; bottom:78px; } }
  </style>
</head>
<body>
  <main class="page"><span class="eyebrow">Always within reach</span><h1>A cart that follows the intent.</h1><p>Keep the purchase path visible without making it the loudest thing on the page.</p><section class="product-list"><article class="product"><div class="image">01</div><h2>Soft focus notebook</h2><p>$24</p><button class="add" type="button">Add to cart</button></article><article class="product"><div class="image" style="background:linear-gradient(145deg,#dc9b75,#744d5a)">02</div><h2>Sunset mug</h2><p>$32</p><button class="add" type="button">Add to cart</button></article></section></main><button class="floating" id="floating" type="button" aria-label="Open cart"><span class="bag-icon">▱</span><span>View cart</span><b class="badge" id="badge">0</b></button><div class="toast" id="toast" role="status"></div>
  <script>
    const badge=document.querySelector("#badge"),toast=document.querySelector("#toast"),floating=document.querySelector("#floating");let count=0;document.querySelectorAll(".add").forEach(button=>button.addEventListener("click",()=>{count++;badge.textContent=count;toast.textContent="Added to your cart ✓";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}));floating.addEventListener("click",()=>{toast.textContent=count?`${count} item${count===1?"":"s"} in your cart`:"Your cart is empty";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f7fb; --surface:#fff; --ink:#1b2533; --muted:#8290a0; --line:#e1e7ee; --blue:#3979dd; --green:#45b886; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f4f7fb,#e9ecff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(360px,calc(100% - 36px)); padding:24px; border:1px solid var(--line); border-radius:17px; background:var(--surface); box-shadow:0 18px 45px #374e7812; } .top { display:flex; justify-content:space-between; align-items:start; } .top label { color:var(--muted); font-size:13px; } .icon { display:grid; place-items:center; width:36px; height:36px; border-radius:10px; color:var(--blue); background:#e8f0ff; font-size:18px; } .value { margin:20px 0 4px; font-size:40px; font-weight:700; letter-spacing:-.09em; } .trend { color:var(--green); font-size:12px; font-weight:700; } .spark { display:block; width:100%; height:60px; margin-top:18px; } .spark path { fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; } .spark polygon { fill:#3979dd14; } .bottom { display:flex; justify-content:space-between; margin-top:16px; padding-top:15px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; } .menu { position:relative; } .menu-button { border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:18px; } .menu-list { position:absolute; z-index:2; top:25px; right:0; display:none; min-width:130px; padding:5px; border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 10px 25px #25334d1b; } .menu.open .menu-list { display:block; } .menu-list button { width:100%; padding:8px; border:0; border-radius:5px; color:var(--ink); background:transparent; text-align:left; cursor:pointer; } .menu-list button:hover { background:#eef2f8; }
  </style>
</head>
<body>
  <article class="card"><div class="top"><div><label>Weekly active users</label><div class="value">28,492</div><span class="trend">↗ 18.4% <span style="color:var(--muted);font-weight:400">vs last week</span></span></div><div class="menu"><button class="menu-button" id="menu" type="button" aria-label="More options">⋯</button><div class="menu-list"><button type="button">View report</button><button type="button">Export data</button></div></div></div><svg class="spark" viewBox="0 0 300 60" aria-label="Weekly active users trend"><polygon points="0,50 25,43 50,46 75,30 100,35 125,25 150,28 175,18 200,23 225,12 250,16 275,7 300,12 300,60 0,60"/><path d="M0 50 25 43 50 46 75 30 100 35 125 25 150 28 175 18 200 23 225 12 250 16 275 7 300 12"/></svg><div class="bottom"><span>Mon, Sep 01</span><span>Sun, Sep 07</span></div></article>
  <script>
    const menu=document.querySelector(".menu"), button=document.querySelector("#menu"); button.addEventListener("click",()=>{ const open=menu.classList.toggle("open"); button.setAttribute("aria-expanded",open); }); document.addEventListener("click",e=>{ if(!menu.contains(e.target)) menu.classList.remove("open"); });
  </script>
</body>
</html>

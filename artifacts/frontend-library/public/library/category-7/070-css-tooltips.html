<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f7fa; --surface:#fff; --ink:#1b2530; --muted:#81909c; --line:#dfe6eb; --blue:#3976ca; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f7fa,#e4eff8); font:14px/1.5 "Manrope",sans-serif; } .page { width:min(800px,calc(100% - 36px)); text-align:center; } .eyebrow { color:var(--blue); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 9px; font-size:clamp(43px,7vw,76px); line-height:.94; letter-spacing:-.1em; } .intro { max-width:550px; margin:0 auto 52px; color:var(--muted); font-size:17px; } .examples { display:flex; justify-content:center; gap:27px; flex-wrap:wrap; } .tip { position:relative; display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; border:1px solid var(--line); border-radius:50%; color:var(--blue); background:var(--surface); font-size:19px; cursor:help; } .tip:after { content:attr(data-tooltip); position:absolute; z-index:2; bottom:calc(100% + 11px); left:50%; width:max-content; max-width:180px; padding:7px 9px; border-radius:6px; color:#fff; background:#1b2b3d; font-size:11px; opacity:0; pointer-events:none; transform:translate(-50%,4px); transition:.18s; } .tip:before { content:""; position:absolute; z-index:2; bottom:calc(100% + 5px); left:50%; border:6px solid transparent; border-top-color:#1b2b3d; opacity:0; transform:translateX(-50%); transition:.18s; } .tip:hover:after, .tip:hover:before, .tip:focus-visible:after, .tip:focus-visible:before { opacity:1; transform:translate(-50%,0); } .tip:focus-visible { outline:3px solid #3976ca55; outline-offset:3px; } .legend { margin-top:32px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="page"><span class="eyebrow">Quiet context</span><h1>Explain the small things.</h1><p class="intro">CSS tooltips are perfect for icon-only actions, provided they are available to keyboard users as well as pointer users.</p><section class="examples" aria-label="Tooltip examples"><button class="tip" data-tooltip="Copy link" type="button" aria-label="Copy link">↗</button><button class="tip" data-tooltip="Add to favorites" type="button" aria-label="Add to favorites">♡</button><button class="tip" data-tooltip="More options" type="button" aria-label="More options">•••</button><button class="tip" data-tooltip="Keyboard shortcut: ⌘ K" type="button" aria-label="Keyboard shortcut command K">⌘</button></section><p class="legend">Hover or focus an icon to reveal its explanation.</p></main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hold To Confirm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#171115; --surface:#24191e; --line:#50313d; --text:#fff2f5; --muted:#b4939e; --pink:#f16a8e; --red:#ff4968; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 10%,#5a2436,transparent 42%),var(--bg); font:15px/1.5 "Manrope",sans-serif; } .card { width:min(460px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:21px; background:#24191eeb; box-shadow:0 26px 75px #0009; text-align:center; } .warning { display:grid; place-items:center; width:48px; height:48px; margin:0 auto 20px; border-radius:50%; color:#fff; background:#f16a8e22; font-size:23px; } h1 { margin:0 0 10px; font-size:31px; letter-spacing:-.07em; } p { margin:0 0 28px; color:var(--muted); }
    .hold { position:relative; overflow:hidden; width:100%; height:57px; border:1px solid var(--pink); border-radius:10px; color:#fff; background:#301b24; font-weight:700; cursor:pointer; user-select:none; touch-action:none; } .hold .fill { position:absolute; z-index:0; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,var(--pink),var(--red)); } .hold .label { position:relative; z-index:1; } .hold:focus-visible { outline:3px solid #f16a8e66; outline-offset:3px; } .hint { min-height:22px; margin-top:17px; color:var(--muted); font-size:12px; } .success { color:#73dda5; }
  </style>
</head>
<body>
  <main class="card"><div class="warning">!</div><h1>Delete this workspace?</h1><p>This action cannot be undone. Press and hold the button for two seconds to confirm.</p><button class="hold" id="hold" type="button" aria-label="Hold to permanently delete workspace"><span class="fill" id="fill"></span><span class="label" id="label">Hold to delete</span></button><div class="hint" id="hint">Keep holding…</div></main>
  <script>
    const hold = document.querySelector("#hold"), fill = document.querySelector("#fill"), label = document.querySelector("#label"), hint = document.querySelector("#hint"); let start = 0, frame, holding = false, done = false; const duration = 2000;
    function animate(time) { if (!holding || done) return; if (!start) start = time; const progress = Math.min((time - start) / duration, 1); fill.style.width = `${progress * 100}%`; hint.textContent = `${Math.ceil((duration - (time - start)) / 1000)} second${Math.ceil((duration - (time - start)) / 1000) === 1 ? "" : "s"} remaining`; if (progress < 1) frame = requestAnimationFrame(animate); else complete(); }
    function begin(e) { e.preventDefault(); if (done) return; holding = true; start = 0; hold.setPointerCapture?.(e.pointerId); frame = requestAnimationFrame(animate); } function stop() { if (!holding || done) return; holding = false; cancelAnimationFrame(frame); start = 0; fill.style.width = "0"; hint.textContent = "Released too soon — nothing changed."; }
    function complete() { holding = false; done = true; fill.style.width = "100%"; label.textContent = "Workspace deleted"; hint.textContent = "The workspace was permanently removed."; hint.className = "hint success"; hold.disabled = true; }
    hold.addEventListener("pointerdown", begin); hold.addEventListener("pointerup", stop); hold.addEventListener("pointercancel", stop); hold.addEventListener("pointerleave", e => { if (holding && e.buttons) stop(); }); hold.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !holding) begin(e); }); hold.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); });
  </script>
</body>
</html>

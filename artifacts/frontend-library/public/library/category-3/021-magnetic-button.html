<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#080b12; --text:#f2f5ff; --muted:#8f9db5; --purple:#967dff; --cyan:#6fe2d2; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 40%,#24204c,transparent 35%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--cyan); font-weight:700; letter-spacing:.15em; text-transform:uppercase; } h1 { margin:14px 0 10px; font-size:clamp(42px,7vw,75px); line-height:1; letter-spacing:-.08em; } p { max-width:480px; margin:0 auto 65px; color:var(--muted); font-size:17px; }
    .magnetic-area { display:inline-block; padding:70px; } .magnetic { position:relative; display:grid; place-items:center; width:170px; height:60px; border:0; border-radius:99px; color:#0a0d14; background:linear-gradient(120deg,var(--cyan),var(--purple)); font-weight:700; cursor:pointer; transition:transform .12s ease-out, box-shadow .2s; } .magnetic:before { content:""; position:absolute; inset:-14px; z-index:-1; border-radius:99px; background:var(--purple); opacity:.16; filter:blur(17px); transition:.2s; } .magnetic:hover { box-shadow:0 12px 35px #806dff55; } .magnetic span { transition:transform .12s ease-out; }
    .hint { margin-top:24px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">Pointer physics</span><h1>Come a little closer.</h1><p>The button subtly follows the cursor inside its magnetic field, making the action feel responsive before the click even happens.</p><div class="magnetic-area"><button class="magnetic" id="magnetic" type="button"><span>Explore the idea →</span></button></div><div class="hint">Move your cursor over the button</div></main>
  <script>
    const area = document.querySelector(".magnetic-area"), button = document.querySelector("#magnetic"), label = button.querySelector("span");
    area.addEventListener("pointermove", e => { const box = area.getBoundingClientRect(), x = e.clientX - box.left - box.width / 2, y = e.clientY - box.top - box.height / 2; button.style.transform = `translate(${x * .18}px,${y * .22}px)`; label.style.transform = `translate(${x * .08}px,${y * .1}px)`; });
    area.addEventListener("pointerleave", () => { button.style.transform = ""; label.style.transform = ""; }); button.addEventListener("click", () => { button.querySelector("span").textContent = "You found it ✓"; });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f7f8fb; --surface:#fff; --ink:#1c2432; --muted:#8994a5; --line:#e5e9f0; --purple:#7559e9; --green:#40b986; --orange:#e59e54; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f7f8fb,#e8edff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(670px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:0 20px 60px #3d4e7b12; } .eyebrow { color:var(--purple); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:9px 0 4px; font-size:31px; letter-spacing:-.07em; } .sub { margin:0 0 32px; color:var(--muted); } .goal { display:grid; gap:24px; } .item { display:grid; gap:9px; } .head { display:flex; justify-content:space-between; align-items:baseline; } .head strong { font-size:14px; } .head span { color:var(--muted); font-size:12px; } .track { height:10px; overflow:hidden; border-radius:99px; background:#edf0f5; } .fill { width:var(--value); height:100%; border-radius:inherit; background:var(--color); animation:load 1s ease both; transform-origin:left; } @keyframes load { from { transform:scaleX(0); } to { transform:scaleX(1); } } .foot { display:flex; justify-content:space-between; margin-top:31px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; } .foot b { color:var(--green); }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Quarterly objectives</span><h1>The work is moving.</h1><p class="sub">Progress across the priorities your team committed to this quarter.</p><section class="goal"><div class="item"><div class="head"><strong>Improve onboarding</strong><span>82%</span></div><div class="track"><div class="fill" style="--value:82%;--color:var(--purple)"></div></div></div><div class="item"><div class="head"><strong>Grow active teams</strong><span>64%</span></div><div class="track"><div class="fill" style="--value:64%;--color:var(--green)"></div></div></div><div class="item"><div class="head"><strong>Reduce response time</strong><span>47%</span></div><div class="track"><div class="fill" style="--value:47%;--color:var(--orange)"></div></div></div></section><div class="foot"><span>Updated just now</span><b>2 goals on track ↗</b></div></main>
</body>
</html>

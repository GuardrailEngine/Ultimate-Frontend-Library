<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0e15; --surface:#141925; --line:#283246; --text:#eef2fb; --muted:#8792a6; --low:#202a3a; --mid:#4263b1; --high:#8f77ff; --hot:#e45bc4; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 80% 0,#282348,transparent 40%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(850px,calc(100% - 36px)); padding:34px; border:1px solid var(--line); border-radius:20px; background:#141925ed; box-shadow:0 25px 75px #0009; } .top { display:flex; justify-content:space-between; align-items:start; } .eyebrow { color:var(--high); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 4px; font-size:30px; letter-spacing:-.07em; } .sub { margin:0; color:var(--muted); } .total { text-align:right; } .total strong { display:block; font-size:28px; } .total span { color:#6fe0ac; font-size:12px; }
    .heatmap { display:grid; grid-template-columns:34px 1fr; gap:10px; margin-top:32px; } .days { display:grid; grid-template-rows:repeat(7,1fr); gap:5px; padding-top:1px; color:var(--muted); font-size:11px; } .days span { display:flex; align-items:center; } .weeks { display:grid; grid-template-columns:repeat(18,1fr); gap:5px; } .week { display:grid; grid-template-rows:repeat(7,1fr); gap:5px; } .cell { position:relative; aspect-ratio:1; min-width:7px; border-radius:3px; background:var(--low); cursor:pointer; } .cell[data-level="1"] { background:var(--mid); } .cell[data-level="2"] { background:#5e62cf; } .cell[data-level="3"] { background:var(--high); } .cell[data-level="4"] { background:var(--hot); } .cell:hover { outline:2px solid #fff; outline-offset:1px; } .months { display:grid; grid-template-columns:repeat(18,1fr); margin:10px 0 0 44px; color:var(--muted); font-size:11px; } .months span { grid-column:span 3; } .legend { display:flex; justify-content:flex-end; align-items:center; gap:5px; margin-top:22px; color:var(--muted); font-size:11px; } .legend i { width:12px; height:12px; border-radius:3px; background:var(--low); } .legend i:nth-of-type(2) { background:var(--mid); } .legend i:nth-of-type(3) { background:var(--high); } .legend i:nth-of-type(4) { background:var(--hot); } .tooltip { position:fixed; z-index:3; padding:7px 9px; border-radius:6px; color:#fff; background:#252e42; font-size:11px; pointer-events:none; opacity:0; transition:opacity .12s; }
    @media(max-width:600px) { .card { padding:24px 16px; } .weeks, .months { gap:3px; } .cell { border-radius:2px; } }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Activity map</span><h1>Consistency compounds</h1><p class="sub">Daily contributions across the last 18 weeks</p></div><div class="total"><strong>76</strong><span>active days</span></div></div><div class="heatmap"><div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div><div class="weeks" id="weeks"></div><div class="months"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></div></div><div class="legend">Less <i></i><i></i><i></i><i></i> More</div></main><div class="tooltip" id="tooltip"></div>
  <script>
    const weeks = document.querySelector("#weeks"), tooltip = document.querySelector("#tooltip"); for (let w=0; w<18; w++) { const week = document.createElement("div"); week.className = "week"; for (let d=0; d<7; d++) { const cell = document.createElement("button"); cell.className = "cell"; cell.type = "button"; const level = Math.random() < .18 ? 0 : Math.ceil(Math.random() * 4); cell.dataset.level = level; const date = new Date(2026,4,4 + w * 7 + d); cell.dataset.text = `${date.toLocaleDateString("en-US",{month:"short",day:"numeric"})}: ${level * 3 + 2} contributions`; cell.addEventListener("mouseenter", event => { tooltip.textContent = cell.dataset.text; tooltip.style.left = `${event.clientX + 10}px`; tooltip.style.top = `${event.clientY - 35}px`; tooltip.style.opacity = "1"; }); cell.addEventListener("mouseleave", () => tooltip.style.opacity = "0"); week.append(cell); } weeks.append(week); }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6fa; --surface:#fff; --ink:#1b2532; --muted:#84909e; --line:#e0e6ee; --blue:#477fe0; --purple:#8d70e8; --green:#3db580; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f4f6fa,#e8edff); font:14px/1.5 "DM Sans",sans-serif; } .page { width:min(1050px,calc(100% - 36px)); margin:6vh auto; } .top { display:flex; justify-content:space-between; align-items:end; margin-bottom:22px; } .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 3px; font-size:32px; letter-spacing:-.08em; } .sub { margin:0; color:var(--muted); } .range { padding:8px 10px; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:var(--surface); cursor:pointer; } .widgets { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; } .widget { padding:19px; border:1px solid var(--line); border-radius:13px; background:var(--surface); } .widget label { color:var(--muted); font-size:12px; } .widget strong { display:block; margin:12px 0 4px; font-size:28px; letter-spacing:-.08em; } .widget .change { color:var(--green); font-size:11px; font-weight:700; } .wide { grid-column:span 2; } .chart { width:100%; height:150px; margin-top:14px; } .chart path { fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; } .chart polygon { fill:#477fe014; } .donut { position:relative; display:grid; place-items:center; width:115px; height:115px; margin:15px auto 0; border-radius:50%; background:conic-gradient(var(--purple) 0 72%,#edf0f5 72%); } .donut:after { content:""; position:absolute; inset:14px; border-radius:50%; background:var(--surface); } .donut b { position:relative; z-index:1; font-size:24px; } .list { display:grid; gap:11px; margin-top:17px; } .list-row { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; } .list-row b { color:var(--ink); }
    @media(max-width:800px) { .widgets { grid-template-columns:repeat(2,1fr); } .wide { grid-column:span 2; } } @media(max-width:500px) { .page { width:calc(100% - 24px); } .top { display:block; } .range { margin-top:15px; } .widgets { display:block; } .widget { margin-bottom:13px; } }
  </style>
</head>
<body>
  <main class="page"><div class="top"><div><span class="eyebrow">Workspace analytics</span><h1>The numbers behind the momentum.</h1><p class="sub">A clear view of what moved this week.</p></div><button class="range" id="range" type="button">Last 7 days⌄</button></div><section class="widgets"><article class="widget"><label>Active users</label><strong id="users">8,492</strong><span class="change">↗ 12.6%</span></article><article class="widget"><label>Conversion</label><strong>4.82%</strong><span class="change">↗ 0.8%</span></article><article class="widget"><label>Avg. session</label><strong>18m</strong><span class="change">↗ 3.1%</span></article><article class="widget"><label>Retention</label><div class="donut"><b>72%</b></div></article><article class="widget wide"><label>Weekly active users</label><svg class="chart" viewBox="0 0 500 150" aria-label="Weekly active user trend"><polygon points="0,120 45,95 90,105 135,70 180,83 225,50 270,65 315,35 360,45 405,20 450,31 500,10 500,150 0,150"/><path d="M0 120 45 95 90 105 135 70 180 83 225 50 270 65 315 35 360 45 405 20 450 31 500 10"/></svg></article><article class="widget wide"><label>Top pages</label><div class="list"><div class="list-row"><span>Homepage</span><b>38.4%</b></div><div class="list-row"><span>Projects</span><b>24.8%</b></div><div class="list-row"><span>Reports</span><b>18.2%</b></div><div class="list-row"><span>Settings</span><b>9.6%</b></div></div></article></section></main>
  <script>
    const range=document.querySelector("#range"),users=document.querySelector("#users");range.addEventListener("click",()=>{const week=range.textContent.startsWith("Last 7");range.textContent=week?"Last 30 days⌄":"Last 7 days⌄";users.textContent=week?"12,908":"8,492"});
  </script>
</body>
</html>

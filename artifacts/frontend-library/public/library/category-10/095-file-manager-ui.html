<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6fa; --surface:#fff; --ink:#1b2633; --muted:#84909f; --line:#e0e6ee; --blue:#477ddd; --yellow:#e4b856; --green:#4bb482; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f4f6fa,#e8eeff); font:14px/1.5 "DM Sans",sans-serif; } .app { display:grid; grid-template-columns:220px 1fr; width:min(1050px,100%); min-height:620px; margin:5vh auto; border:1px solid var(--line); border-radius:17px; overflow:hidden; background:var(--surface); box-shadow:0 20px 60px #334a7813; } aside { padding:23px 14px; border-right:1px solid var(--line); background:#fbfcfe; } .brand { padding:0 10px 30px; font-size:19px; font-weight:700; letter-spacing:-.07em; } .brand span { color:var(--blue); } .side-link { display:flex; gap:9px; padding:10px; border-radius:7px; color:var(--muted); text-decoration:none; } .side-link.active, .side-link:hover { color:var(--blue); background:#edf3ff; } .storage { margin-top:40px; padding:12px; border-radius:9px; color:var(--muted); background:#edf1f7; font-size:11px; } .storage strong { display:block; margin-bottom:8px; color:var(--ink); font-size:13px; } .bar { height:6px; overflow:hidden; border-radius:99px; background:#dce3ec; } .bar span { display:block; width:68%; height:100%; background:var(--blue); } .main { min-width:0; padding:25px; } .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:27px; } .crumb { color:var(--muted); } .upload { padding:9px 12px; border:0; border-radius:7px; color:#fff; background:var(--blue); cursor:pointer; font-weight:700; } .folder-head { display:flex; align-items:center; gap:8px; margin-bottom:15px; } .folder-head h1 { margin:0; font-size:23px; letter-spacing:-.06em; } .view-toggle { display:flex; gap:4px; margin-left:auto; } .view-toggle button { border:1px solid var(--line); border-radius:6px; color:var(--muted); background:#fff; cursor:pointer; } .view-toggle button.active { color:var(--blue); background:#edf3ff; } .files { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } .file { padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; } .file:hover { border-color:var(--blue); } .file-icon { display:grid; place-items:center; width:43px; height:43px; margin-bottom:12px; border-radius:9px; color:var(--yellow); background:#fff5d9; font-size:20px; } .file-icon.blue { color:var(--blue); background:#edf3ff; } .file strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; } .file small { color:var(--muted); font-size:11px; } .files.list { display:block; } .files.list .file { display:flex; align-items:center; gap:13px; margin-bottom:7px; } .files.list .file-icon { margin:0; } .notice { min-height:20px; margin-top:18px; color:var(--green); font-size:12px; }
    @media(max-width:700px) { .app { display:block; width:calc(100% - 24px); min-height:0; margin:12px auto; } aside { border-right:0; border-bottom:1px solid var(--line); } .side-link { display:inline-flex; } .storage { display:none; } .files { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="app"><aside><div class="brand">drive<span>space</span></div><a class="side-link active" href="#recent">▧ Recent</a><a class="side-link" href="#shared">♧ Shared with me</a><a class="side-link" href="#starred">☆ Starred</a><a class="side-link" href="#trash">⌫ Trash</a><div class="storage"><strong>Storage</strong><div class="bar"><span></span></div><p>68 GB of 100 GB used</p></div></aside><main class="main"><div class="top"><span class="crumb">My drive / Projects</span><button class="upload" id="upload" type="button">＋ Upload</button></div><div class="folder-head"><h1>Projects</h1><span class="view-toggle"><button class="active" id="gridView" type="button">▦</button><button id="listView" type="button">☷</button></span></div><section class="files" id="files"><article class="file"><div class="file-icon">▰</div><strong>2026 planning</strong><small>Folder · 12 items</small></article><article class="file"><div class="file-icon">▰</div><strong>Research archive</strong><small>Folder · 48 items</small></article><article class="file"><div class="file-icon blue">PDF</div><strong>Brand brief.pdf</strong><small>2.4 MB · today</small></article><article class="file"><div class="file-icon blue">XLS</div><strong>Budget forecast.xlsx</strong><small>840 KB · yesterday</small></article><article class="file"><div class="file-icon blue">DOC</div><strong>Launch copy.docx</strong><small>1.1 MB · Aug 30</small></article></section><div class="notice" id="notice" role="status"></div></main></div>
  <script>
    const files=document.querySelector("#files"),notice=document.querySelector("#notice");document.querySelector("#gridView").addEventListener("click",e=>{files.classList.remove("list");e.currentTarget.classList.add("active");document.querySelector("#listView").classList.remove("active")});document.querySelector("#listView").addEventListener("click",e=>{files.classList.add("list");e.currentTarget.classList.add("active");document.querySelector("#gridView").classList.remove("active")});document.querySelector("#upload").addEventListener("click",()=>{notice.textContent="Upload dialog would open here — ready for your files.";});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Data Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f7fa; --surface:#fff; --ink:#1b2730; --muted:#84919b; --line:#e0e7ec; --blue:#3f7bcb; --green:#36aa77; --yellow:#d6973c; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f7fa,#e8eff8); font:13px/1.5 "Manrope",sans-serif; } .page { width:min(1050px,calc(100% - 36px)); margin:6vh auto; } .top { display:flex; justify-content:space-between; align-items:end; margin-bottom:24px; } .eyebrow { color:var(--blue); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 4px; font-size:31px; letter-spacing:-.08em; } .sub { margin:0; color:var(--muted); } .search { width:210px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; outline:0; background:var(--surface); } .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface); } table { width:100%; min-width:650px; border-collapse:collapse; } th,td { padding:15px 17px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { color:var(--muted); background:#fafbfc; font-size:11px; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; } th:hover { color:var(--blue); } tr:last-child td { border-bottom:0; } td:first-child { font-weight:700; } .person { display:flex; align-items:center; gap:9px; } .avatar { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; color:#fff; background:#6989d7; font-size:10px; } .status { display:inline-block; padding:4px 8px; border-radius:5px; font-size:11px; font-weight:700; } .active { color:var(--green); background:#e5f7ee; } .paused { color:var(--yellow); background:#fff3dd; } .pager { display:flex; justify-content:space-between; align-items:center; margin-top:14px; color:var(--muted); } .pages { display:flex; gap:5px; } .pages button { width:29px; height:29px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:var(--surface); cursor:pointer; } .pages button.active { color:#fff; border-color:var(--blue); background:var(--blue); }
    @media(max-width:600px) { .page { width:calc(100% - 24px); } .top { display:block; } .search { width:100%; margin-top:18px; } }
  </style>
</head>
<body>
  <main class="page"><div class="top"><div><span class="eyebrow">People directory</span><h1>Everyone, in one view.</h1><p class="sub">Search, sort, and scan the team's latest status.</p></div><input class="search" id="search" type="search" placeholder="Search people..." aria-label="Search people"></div><div class="table-wrap"><table><thead><tr><th data-key="name">Name ↕</th><th data-key="role">Role ↕</th><th data-key="status">Status ↕</th><th data-key="last">Last active ↕</th></tr></thead><tbody id="body"></tbody></table></div><div class="pager"><span id="summary"></span><div class="pages"><button id="prev" type="button">←</button><div id="pages"></div><button id="next" type="button">→</button></div></div></main>
  <script>
    const people=[["Mina Chen","Product designer","Active","2 min ago","MC"],["Alex Morgan","Engineer","Active","18 min ago","AM"],["Nadia El Idrissi","Researcher","Paused","1 hour ago","NE"],["Jonas Lee","Product lead","Active","2 hours ago","JL"],["Leila Benali","Content strategist","Active","3 hours ago","LB"],["Omar Haddad","Engineer","Paused","Yesterday","OH"],["Ana Ruiz","Account director","Active","Yesterday","AR"],["Sami Rahman","Designer","Active","2 days ago","SR"]];const body=document.querySelector("#body"),search=document.querySelector("#search"),pages=document.querySelector("#pages"),summary=document.querySelector("#summary");let filtered=people,page=1,sortKey=0,ascending=true;function render(){const start=(page-1)*4,shown=filtered.slice(start,start+4);body.innerHTML=shown.map(p=>`<tr><td><div class="person"><span class="avatar">${p[4]}</span>${p[0]}</div></td><td>${p[1]}</td><td><span class="status ${p[2].toLowerCase()}">${p[2]}</span></td><td>${p[3]}</td></tr>`).join("");const total=Math.ceil(filtered.length/4);pages.innerHTML=Array.from({length:total},(_,i)=>`<button class="${i+1===page?"active":""}" data-page="${i+1}" type="button">${i+1}</button>`).join("");pages.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{page=Number(b.dataset.page);render()}));summary.textContent=filtered.length?`Showing ${start+1}–${Math.min(start+4,filtered.length)} of ${filtered.length}`:"No people found";document.querySelector("#prev").disabled=page===1;document.querySelector("#next").disabled=page===total||!total}search.addEventListener("input",()=>{const q=search.value.toLowerCase();filtered=people.filter(p=>p.slice(0,4).join(" ").toLowerCase().includes(q));page=1;render()});document.querySelectorAll("th").forEach((th,i)=>th.addEventListener("click",()=>{if(sortKey===i)ascending=!ascending;sortKey=i;filtered.sort((a,b)=>a[i].localeCompare(b[i])*(ascending?1:-1));render()}));document.querySelector("#prev").addEventListener("click",()=>{page--;render()});document.querySelector("#next").addEventListener("click",()=>{page++;render()});render();
  </script>
</body>
</html>

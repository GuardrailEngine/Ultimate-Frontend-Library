<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indeterminate Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f8f7; --surface:#fff; --ink:#17241f; --muted:#7d8a82; --line:#dfe8e2; --green:#258963; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f8f7,#e3f2eb); font:14px/1.5 "Manrope",sans-serif; } .card { width:min(620px,calc(100% - 36px)); padding:32px; border:1px solid var(--line); border-radius:19px; background:var(--surface); box-shadow:0 20px 55px #315b4612; } .top { display:flex; justify-content:space-between; align-items:start; } .eyebrow { color:var(--green); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:9px 0 5px; font-size:29px; letter-spacing:-.07em; } .sub { margin:0; color:var(--muted); } .stop { padding:8px 11px; border:1px solid var(--line); border-radius:7px; color:var(--green); background:transparent; cursor:pointer; }
    .bar { position:relative; height:7px; margin:35px 0 13px; overflow:hidden; border-radius:99px; background:#e8efe9; } .bar span { position:absolute; top:0; bottom:0; left:0; width:35%; border-radius:inherit; background:var(--green); animation:travel 1.5s ease-in-out infinite; } @keyframes travel { 0% { transform:translateX(-120%); } 50% { transform:translateX(210%); } 100% { transform:translateX(310%); } } .status { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; } .status b { color:var(--green); } .paused .bar span { animation-play-state:paused; opacity:.35; }
  </style>
</head>
<body>
  <main class="card" id="card"><div class="top"><div><span class="eyebrow">Processing</span><h1>Finding your best matches.</h1><p class="sub">This can take a moment while we compare the latest signals.</p></div><button class="stop" id="stop" type="button">Pause</button></div><div class="bar" role="progressbar" aria-label="Processing in progress"><span></span></div><div class="status"><span id="status">Searching 2,480 records</span><b id="state">Live</b></div></main>
  <script>
    const card=document.querySelector("#card"), stop=document.querySelector("#stop"), state=document.querySelector("#state"); stop.addEventListener("click",()=>{const paused=card.classList.toggle("paused");stop.textContent=paused?"Resume":"Pause";state.textContent=paused?"Paused":"Live";});
  </script>
</body>
</html>

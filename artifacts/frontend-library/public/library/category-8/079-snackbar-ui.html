<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snackbar UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0c1118; --surface:#18212d; --line:#2a394b; --text:#f0f5fb; --muted:#91a0b1; --blue:#78a9ff; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 70% 0,#1e3c55,transparent 40%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--blue); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:13px 0 9px; font-size:clamp(44px,7vw,78px); line-height:.94; letter-spacing:-.1em; } .stage p { margin:0 auto 35px; color:var(--muted); font-size:17px; } .action { padding:12px 16px; border:1px solid var(--blue); border-radius:8px; color:#0a1119; background:var(--blue); cursor:pointer; font-weight:700; }
    .snackbar { position:fixed; z-index:4; right:20px; bottom:20px; left:20px; display:flex; align-items:center; gap:13px; width:min(520px,calc(100% - 40px)); margin:auto; padding:13px 15px; border:1px solid var(--line); border-radius:9px; background:var(--surface); box-shadow:0 14px 35px #0008; transform:translateY(130%); transition:.3s; } .snackbar.show { transform:none; } .snack-icon { display:grid; place-items:center; width:25px; height:25px; border-radius:50%; color:var(--blue); background:#78a9ff1b; } .snackbar p { flex:1; margin:0; color:var(--text); font-size:13px; } .snackbar p small { color:var(--muted); } .undo { border:0; color:var(--blue); background:transparent; cursor:pointer; font-weight:700; } .dismiss { border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:18px; }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">A temporary interruption</span><h1>Keep the undo close.</h1><p>A snackbar confirms a lightweight action and gives the user a brief path back.</p><button class="action" id="action" type="button">Archive conversation</button></main><div class="snackbar" id="snackbar" role="status"><span class="snack-icon">✓</span><p>Conversation archived <small>· just now</small></p><button class="undo" id="undo" type="button">Undo</button><button class="dismiss" id="dismiss" type="button" aria-label="Dismiss">×</button></div>
  <script>
    const snackbar=document.querySelector("#snackbar"),action=document.querySelector("#action"); let timer; function show(){snackbar.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>snackbar.classList.remove("show"),5000)} action.addEventListener("click",()=>{action.textContent="Conversation archived ✓";show()}); document.querySelector("#dismiss").addEventListener("click",()=>snackbar.classList.remove("show")); document.querySelector("#undo").addEventListener("click",()=>{snackbar.classList.remove("show");action.textContent="Archive conversation";});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Ring Spinner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0f17; --text:#eff5ff; --muted:#8594aa; --purple:#9a83ff; --cyan:#65e2d4; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 20%,#263257,transparent 38%),var(--bg); font:15px/1.5 "Space Grotesk",sans-serif; } .stage { text-align:center; } .eyebrow { color:var(--cyan); font-weight:700; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:13px 0 9px; font-size:clamp(44px,7vw,78px); line-height:.95; letter-spacing:-.1em; } p { margin:0 auto 53px; color:var(--muted); font-size:17px; }
    .spinner { position:relative; display:inline-block; width:96px; height:96px; } .ring { position:absolute; inset:0; border:4px solid transparent; border-radius:50%; } .ring.one { border-top-color:var(--cyan); border-right-color:var(--cyan); animation:spin 1s linear infinite; } .ring.two { inset:13px; border-bottom-color:var(--purple); border-left-color:var(--purple); animation:spinReverse .75s linear infinite; } .dot { position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 15px var(--cyan); transform:translate(-50%,-50%); } @keyframes spin { to { transform:rotate(360deg); } } @keyframes spinReverse { to { transform:rotate(-360deg); } } .status { min-height:24px; margin-top:26px; color:var(--muted); font-size:13px; } .status.done { color:var(--cyan); }
  </style>
</head>
<body>
  <main class="stage"><span class="eyebrow">Asynchronous by design</span><h1>Keep the waiting alive.</h1><p>A dual-ring spinner adds motion and hierarchy to a moment when there is no result yet.</p><div class="spinner" role="status" aria-label="Loading"><i class="ring one"></i><i class="ring two"></i><i class="dot"></i></div><div class="status" id="status">Connecting to the workspace…</div></main>
  <script>
    const status=document.querySelector("#status"); setTimeout(()=>{status.textContent="Workspace connected ✓";status.classList.add("done");document.querySelector(".spinner").setAttribute("aria-label","Loaded")},3500);
  </script>
</body>
</html>

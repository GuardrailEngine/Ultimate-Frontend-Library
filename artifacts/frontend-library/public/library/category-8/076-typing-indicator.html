<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Indicator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6fa; --surface:#fff; --ink:#202a36; --muted:#8793a2; --line:#e0e6ee; --blue:#427ddd; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f4f6fa,#e9efff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(500px,calc(100% - 36px)); padding:24px; border:1px solid var(--line); border-radius:17px; background:var(--surface); box-shadow:0 20px 55px #33497012; } .head { display:flex; justify-content:space-between; align-items:center; padding-bottom:17px; border-bottom:1px solid var(--line); } .head strong { font-size:16px; } .online { color:#37ad78; font-size:12px; } .thread { display:grid; gap:15px; min-height:270px; padding:20px 0; } .message { display:flex; gap:9px; align-items:end; } .message.me { justify-content:flex-end; } .avatar { display:grid; place-items:center; width:29px; height:29px; border-radius:50%; color:#fff; background:#6b91df; font-size:10px; font-weight:700; } .bubble { max-width:280px; padding:10px 13px; border-radius:12px 12px 12px 3px; color:#5d6876; background:#eff3f8; } .me .bubble { border-radius:12px 12px 3px 12px; color:#fff; background:var(--blue); } .indicator { display:flex; align-items:center; gap:4px; width:max-content; padding:10px 13px; border-radius:12px 12px 12px 3px; background:#eff3f8; } .indicator i { width:5px; height:5px; border-radius:50%; background:#6d7f9a; animation:type .7s infinite alternate; } .indicator i:nth-child(2) { animation-delay:.16s; } .indicator i:nth-child(3) { animation-delay:.32s; } @keyframes type { to { transform:translateY(-4px); opacity:.4; } } .controls { display:flex; gap:8px; padding-top:17px; border-top:1px solid var(--line); } input { min-width:0; flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; outline:0; } button { padding:10px 13px; border:0; border-radius:8px; color:#fff; background:var(--blue); cursor:pointer; }
  </style>
</head>
<body>
  <main class="card"><div class="head"><strong>Design feedback</strong><span class="online">● Alex is online</span></div><section class="thread" id="thread"><div class="message"><div class="avatar">AM</div><div class="bubble">The new direction feels much clearer.</div></div><div class="message me"><div class="bubble">That was the goal. I tightened the first step.</div></div><div class="message"><div class="avatar">AM</div><div class="indicator" id="indicator" role="status" aria-label="Alex is typing"><i></i><i></i><i></i></div></div></section><form class="controls" id="form"><input id="input" placeholder="Reply to Alex..." aria-label="Reply"><button type="submit">Send</button></form></main>
  <script>
    const form=document.querySelector("#form"),input=document.querySelector("#input"),thread=document.querySelector("#thread"); form.addEventListener("submit",e=>{e.preventDefault();if(!input.value.trim())return;document.querySelector("#indicator").parentElement.remove();const message=document.createElement("div");message.className="message me";message.innerHTML=`<div class="bubble">${input.value.replace(/[<>&]/g,character=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[character]))}</div>`;thread.append(message);input.value="";setTimeout(()=>{const row=document.createElement("div");row.className="message";row.innerHTML='<div class="avatar">AM</div><div class="bubble">I am reading that now — one moment.</div>';thread.append(row)},800)});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masked Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#15120f; --card:#211b16; --line:#49392c; --ink:#f7efe5; --muted:#aa9887; --orange:#f09b53; --green:#6bd49f; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 70% 10%,#4d2b18,transparent 39%),var(--bg); font:15px/1.5 "Space Grotesk",sans-serif; } button, input { font:inherit; }
    .card { width:min(490px,calc(100% - 36px)); padding:37px; border:1px solid var(--line); border-radius:21px; background:#211b16ed; box-shadow:0 25px 70px #0009; } .eyebrow { color:var(--orange); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 8px; font-size:32px; letter-spacing:-.07em; } .intro { margin:0 0 27px; color:var(--muted); } .field { margin-bottom:20px; } label { display:flex; justify-content:space-between; margin-bottom:7px; color:#d4c3b3; font-size:13px; font-weight:700; } label small { color:var(--muted); font-weight:400; } .input-wrap { display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:#17120f; } .input-wrap:focus-within { border-color:var(--orange); box-shadow:0 0 0 3px #f09b531c; } .prefix { padding-left:14px; color:var(--muted); } input { min-width:0; flex:1; padding:13px 12px; border:0; outline:0; color:var(--ink); background:transparent; letter-spacing:.04em; } .hint { display:block; min-height:19px; margin-top:6px; color:var(--muted); font-size:12px; } .invalid { color:#ff8c91; } .submit { width:100%; padding:13px; border:0; border-radius:9px; color:#21130a; background:var(--orange); font-weight:700; cursor:pointer; } .submit:disabled { opacity:.45; cursor:not-allowed; } .success { margin-top:15px; color:var(--green); text-align:center; }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">Billing profile</span><h1>Where should we send it?</h1><p class="intro">Add your contact details for invoices and delivery updates.</p><form id="form" novalidate><div class="field"><label for="phone">Phone number <small>Format: +212 6 12 34 56 78</small></label><div class="input-wrap"><span class="prefix">+212</span><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="6 12 34 56 78"><input type="hidden" id="phoneValue"></div><span class="hint" id="phoneHint">Morocco mobile number</span></div><div class="field"><label for="card">Card number</label><div class="input-wrap"><input id="card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000"></div><span class="hint" id="cardHint">16 digits</span></div><button class="submit" id="submit" type="submit" disabled>Save details</button><div class="success" id="success" role="status"></div></form></main>
  <script>
    const phone = document.querySelector("#phone"), card = document.querySelector("#card"), submit = document.querySelector("#submit"), phoneHint = document.querySelector("#phoneHint"), cardHint = document.querySelector("#cardHint");
    function formatPhone(value) { return value.replace(/\D/g,"").slice(0,9).replace(/(\d{2})(?=\d)/g,"$1 ").trim(); } function formatCard(value) { return value.replace(/\D/g,"").slice(0,16).replace(/(\d{4})(?=\d)/g,"$1 "); }
    function update() { const phoneDigits = phone.value.replace(/\D/g,""), cardDigits = card.value.replace(/\D/g,""); phone.classList.toggle("invalid", phoneDigits.length > 0 && phoneDigits.length < 9); card.classList.toggle("invalid", cardDigits.length > 0 && cardDigits.length < 16); phoneHint.textContent = phoneDigits.length === 9 ? "Number looks good ✓" : "Morocco mobile number"; cardHint.textContent = cardDigits.length === 16 ? "Card number looks good ✓" : `${cardDigits.length}/16 digits`; submit.disabled = phoneDigits.length !== 9 || cardDigits.length !== 16; }
    phone.addEventListener("input", () => { phone.value = formatPhone(phone.value); update(); }); card.addEventListener("input", () => { card.value = formatCard(card.value); update(); }); document.querySelector("#form").addEventListener("submit", e => { e.preventDefault(); document.querySelector("#success").textContent = "Details saved securely ✓"; submit.textContent = "Saved"; submit.disabled = true; });
  </script>
</body>
</html>

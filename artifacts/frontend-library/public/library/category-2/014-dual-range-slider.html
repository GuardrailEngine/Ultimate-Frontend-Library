<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Range Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f6fa; --surface:#fff; --ink:#1b2130; --muted:#7d8799; --line:#e1e5ed; --purple:#7657ed; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f6fa,#ede9ff); font:15px/1.5 "DM Sans",sans-serif; } .card { width:min(480px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:20px; background:#fffdfd; box-shadow:0 20px 60px #45407518; } .top { display:flex; align-items:start; justify-content:space-between; } h1 { margin:0 0 7px; font-size:27px; letter-spacing:-.06em; } .top p { margin:0; color:var(--muted); } .reset { border:0; color:var(--purple); background:transparent; cursor:pointer; }
    .values { display:flex; gap:12px; margin:31px 0 28px; } .value { flex:1; padding:13px; border:1px solid var(--line); border-radius:10px; } .value span { display:block; color:var(--muted); font-size:12px; } .value strong { display:block; margin-top:4px; font-size:21px; } .slider { position:relative; height:5px; margin:0 10px 16px; background:var(--line); } .track { position:absolute; height:100%; background:var(--purple); } input[type=range] { position:absolute; z-index:2; top:-7px; width:calc(100% + 20px); height:20px; margin:0 -10px; pointer-events:none; appearance:none; background:transparent; } input[type=range]::-webkit-slider-thumb { width:20px; height:20px; border:4px solid var(--surface); border-radius:50%; background:var(--purple); box-shadow:0 0 0 1px #c8bfff,0 3px 8px #7657ed4d; pointer-events:auto; appearance:none; cursor:grab; } input[type=range]::-moz-range-thumb { width:12px; height:12px; border:4px solid var(--surface); border-radius:50%; background:var(--purple); box-shadow:0 0 0 1px #c8bfff; pointer-events:auto; cursor:grab; } .scale { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; } .hint { margin-top:29px; padding:13px; border-radius:9px; color:#5c6474; background:#f4f1ff; font-size:13px; }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><h1>Set your budget</h1><p>Find projects within your range.</p></div><button class="reset" id="reset" type="button">Reset</button></div><div class="values"><div class="value"><span>Minimum</span><strong id="minValue">$1,200</strong></div><div class="value"><span>Maximum</span><strong id="maxValue">$8,500</strong></div></div><div class="slider"><div class="track" id="track"></div><input id="min" type="range" min="0" max="10000" step="100" value="1200" aria-label="Minimum budget"><input id="max" type="range" min="0" max="10000" step="100" value="8500" aria-label="Maximum budget"></div><div class="scale"><span>$0</span><span>$10k+</span></div><div class="hint" id="hint">Showing projects from $1,200 to $8,500.</div></main>
  <script>
    const min = document.querySelector("#min"), max = document.querySelector("#max"), minValue = document.querySelector("#minValue"), maxValue = document.querySelector("#maxValue"), track = document.querySelector("#track"), hint = document.querySelector("#hint");
    const money = n => `$${Number(n).toLocaleString()}`;
    function update(source) { if (Number(min.value) > Number(max.value) - 200) { if (source === min) min.value = Number(max.value) - 200; else max.value = Number(min.value) + 200; } const low = Number(min.value), high = Number(max.value); minValue.textContent = money(low); maxValue.textContent = money(high); track.style.left = `${low / 10000 * 100}%`; track.style.width = `${(high - low) / 10000 * 100}%`; hint.textContent = `Showing projects from ${money(low)} to ${money(high)}.`; }
    min.addEventListener("input", () => update(min)); max.addEventListener("input", () => update(max)); document.querySelector("#reset").addEventListener("click", () => { min.value = 1200; max.value = 8500; update(max); }); update(max);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Meter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f7fb; --surface:#fff; --ink:#1b2431; --muted:#7b8798; --line:#e0e5ec; --blue:#4877e8; --red:#e15d68; --yellow:#ecb94a; --green:#3eb884; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f7fb,#e9edff); font:15px/1.5 "DM Sans",sans-serif; } button, input { font:inherit; }
    .card { width:min(460px,calc(100% - 36px)); padding:38px; border:1px solid var(--line); border-radius:22px; background:#fff; box-shadow:0 25px 60px #2b3d6915; } .lock { display:grid; place-items:center; width:44px; height:44px; margin-bottom:20px; border-radius:13px; color:var(--blue); background:#eaf0ff; font-size:22px; } h1 { margin:0 0 9px; font-size:31px; letter-spacing:-.07em; } .intro { margin:0 0 27px; color:var(--muted); } .field { position:relative; } label { display:block; margin-bottom:7px; color:#556273; font-size:13px; font-weight:700; } input { width:100%; padding:13px 47px 13px 14px; border:1px solid var(--line); border-radius:9px; outline:0; color:var(--ink); background:#fbfcff; } input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #4877e81c; } .eye { position:absolute; right:12px; bottom:10px; border:0; color:var(--muted); background:transparent; cursor:pointer; }
    .meter { display:flex; gap:5px; margin:13px 0 8px; } .bar { flex:1; height:5px; border-radius:99px; background:var(--line); transition:.2s; } .meter.weak .bar:nth-child(-n+1) { background:var(--red); } .meter.fair .bar:nth-child(-n+2) { background:var(--yellow); } .meter.good .bar:nth-child(-n+3) { background:#73c789; } .meter.strong .bar { background:var(--green); } .strength { color:var(--muted); font-size:12px; } .strength b { color:var(--ink); } .rules { display:grid; gap:8px; margin:24px 0; padding:17px; border-radius:10px; background:#f6f8fb; } .rule { color:var(--muted); font-size:13px; } .rule:before { content:"○"; display:inline-block; width:22px; color:#a8b2c0; } .rule.valid { color:var(--ink); } .rule.valid:before { content:"✓"; color:var(--green); font-weight:700; } .submit { width:100%; padding:13px; border:0; border-radius:9px; color:#fff; background:var(--blue); font-weight:700; cursor:pointer; } .submit:disabled { opacity:.45; cursor:not-allowed; }
  </style>
</head>
<body>
  <main class="card"><div class="lock">⌑</div><h1>Create a strong password</h1><p class="intro">Use a password you do not use anywhere else.</p><form id="form"><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Enter a password"><button class="eye" id="eye" type="button" aria-label="Show password">◉</button></div><div class="meter" id="meter"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="strength">Strength: <b id="strength">Not entered</b></div><div class="rules"><div class="rule" data-rule="length">At least 8 characters</div><div class="rule" data-rule="upper">One uppercase letter</div><div class="rule" data-rule="number">One number</div><div class="rule" data-rule="special">One special character</div></div><button class="submit" id="submit" type="submit" disabled>Set password</button></form></main>
  <script>
    const password = document.querySelector("#password"), meter = document.querySelector("#meter"), strength = document.querySelector("#strength"), submit = document.querySelector("#submit");
    function evaluate() { const value = password.value, checks = { length:value.length >= 8, upper:/[A-Z]/.test(value), number:/\d/.test(value), special:/[^A-Za-z0-9]/.test(value) }, score = Object.values(checks).filter(Boolean).length; Object.entries(checks).forEach(([key,valid]) => document.querySelector(`[data-rule="${key}"]`).classList.toggle("valid", valid)); meter.className = `meter ${score ? ["","weak","fair","good","strong"][score] : ""}`; strength.textContent = score === 0 ? "Not entered" : ["","Weak","Fair","Good","Strong"][score]; submit.disabled = score < 4; return score; }
    password.addEventListener("input", evaluate); document.querySelector("#eye").addEventListener("click", e => { const hidden = password.type === "password"; password.type = hidden ? "text" : "password"; e.currentTarget.textContent = hidden ? "◌" : "◉"; e.currentTarget.setAttribute("aria-label", hidden ? "Hide password" : "Show password"); }); document.querySelector("#form").addEventListener("submit", e => { e.preventDefault(); submit.textContent = "Password set ✓"; submit.disabled = true; });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d1018; --panel:#151b27; --line:#2c374c; --text:#f2f5fb; --muted:#8f9bb1; --accent:#8b7cff; --good:#63d5a0; --bad:#ff7785; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 0,#2a2052,transparent 42%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } button { font:inherit; }
    .card { width:min(440px,calc(100% - 36px)); padding:clamp(28px,7vw,48px); border:1px solid var(--line); border-radius:24px; background:#151b27e8; box-shadow:0 25px 80px #0008; text-align:center; } .mark { display:grid; place-items:center; width:46px; height:46px; margin:0 auto 25px; border-radius:14px; color:#fff; background:var(--accent); font-size:23px; box-shadow:0 9px 25px #8b7cff55; } h1 { margin:0 0 9px; font-size:30px; letter-spacing:-.06em; } .intro { margin:0 auto 27px; color:var(--muted); } .intro strong { color:var(--text); font-weight:600; }
    .otp { display:flex; justify-content:center; gap:9px; margin:28px 0 17px; } .otp input { width:45px; height:55px; border:1px solid var(--line); border-radius:11px; outline:0; color:var(--text); background:#0c111a; font-size:24px; font-weight:700; text-align:center; transition:.2s; } .otp input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #8b7cff24; } .otp.error input { border-color:var(--bad); animation:shake .3s; } @keyframes shake { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
    .status { min-height:22px; color:var(--bad); font-size:13px; } .verify { width:100%; margin-top:16px; padding:13px; border:0; border-radius:10px; color:#fff; background:var(--accent); font-weight:700; cursor:pointer; } .verify:disabled { opacity:.45; cursor:not-allowed; } .resend { margin-top:22px; border:0; color:var(--accent); background:transparent; cursor:pointer; } .resend:disabled { color:var(--muted); cursor:wait; } .success { color:var(--good); }
    @media(max-width:400px) { .otp { gap:5px; } .otp input { width:40px; } }
  </style>
</head>
<body>
  <main class="card"><div class="mark">✦</div><h1>Check your inbox</h1><p class="intro">We sent a 6-digit code to <strong>samira@example.com</strong></p><form id="otpForm"><div class="otp" id="otp" aria-label="One-time password"><input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" aria-label="Digit 3"><input inputmode="numeric" maxlength="1" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" aria-label="Digit 6"></div><div class="status" id="status" role="status" aria-live="polite"></div><button class="verify" id="verify" type="submit" disabled>Verify code</button></form><button class="resend" id="resend" type="button">Resend code</button></main>
  <script>
    const inputs = [...document.querySelectorAll(".otp input")], form = document.querySelector("#otpForm"), otp = document.querySelector("#otp"), status = document.querySelector("#status"), verify = document.querySelector("#verify"), resend = document.querySelector("#resend");
    function update() { verify.disabled = inputs.some(input => !input.value); }
    inputs.forEach((input, i) => { input.addEventListener("input", () => { input.value = input.value.replace(/\D/g,"").slice(-1); if (input.value && i < inputs.length - 1) inputs[i + 1].focus(); update(); }); input.addEventListener("keydown", e => { if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus(); if (e.key === "ArrowLeft" && i > 0) inputs[i - 1].focus(); if (e.key === "ArrowRight" && i < inputs.length - 1) inputs[i + 1].focus(); }); input.addEventListener("paste", e => { e.preventDefault(); [...e.clipboardData.getData("text").replace(/\D/g,"")].slice(0, inputs.length).forEach((digit, n) => inputs[n].value = digit); inputs[Math.min(inputs.length - 1, e.clipboardData.getData("text").length - 1)].focus(); update(); }); });
    form.addEventListener("submit", e => { e.preventDefault(); if (inputs.map(i => i.value).join("") === "246810") { status.textContent = "Code accepted. Welcome back."; status.className = "status success"; verify.textContent = "Verified ✓"; verify.disabled = true; } else { status.textContent = "That code does not match. Try again."; otp.classList.add("error"); setTimeout(() => otp.classList.remove("error"), 400); inputs[0].focus(); } });
    resend.addEventListener("click", () => { let seconds = 30; resend.disabled = true; resend.textContent = `Resend in ${seconds}s`; const timer = setInterval(() => { seconds--; resend.textContent = `Resend in ${seconds}s`; if (!seconds) { clearInterval(timer); resend.disabled = false; resend.textContent = "Resend code"; } }, 1000); });
    inputs[0].focus();
  </script>
</body>
</html>

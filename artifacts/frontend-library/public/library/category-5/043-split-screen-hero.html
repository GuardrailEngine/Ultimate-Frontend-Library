<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Screen Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#15211b; --cream:#f8f3e8; --green:#1e5d43; --orange:#e87845; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--cream); font:15px/1.5 "Space Grotesk",sans-serif; } .hero { display:grid; grid-template-columns:1fr 1fr; min-height:100vh; } .copy { display:flex; flex-direction:column; justify-content:center; padding:clamp(35px,8vw,110px); } .logo { position:absolute; top:30px; color:var(--ink); font-size:20px; font-weight:700; letter-spacing:-.07em; } .logo span { color:var(--orange); } .eyebrow { color:var(--orange); font-weight:700; letter-spacing:.15em; text-transform:uppercase; } h1 { max-width:600px; margin:18px 0 22px; font-size:clamp(50px,7vw,98px); line-height:.88; letter-spacing:-.11em; } .copy p { max-width:450px; color:#6c756d; font-size:18px; } .actions { display:flex; gap:12px; margin-top:26px; } .actions a { padding:12px 17px; border-radius:7px; text-decoration:none; font-weight:700; } .primary { color:#fff; background:var(--green); } .secondary { border:1px solid #bec4b9; color:var(--ink); } .visual { position:relative; display:grid; place-items:center; overflow:hidden; background:var(--green); } .visual:before { content:""; position:absolute; width:75%; aspect-ratio:1; border-radius:50%; background:var(--orange); opacity:.9; } .visual:after { content:""; position:absolute; width:45%; aspect-ratio:1; border:1px solid #ffffff88; border-radius:50%; } .shape { position:relative; z-index:1; width:42%; aspect-ratio:1; border:20px solid var(--cream); border-radius:48% 52% 65% 35%; transform:rotate(35deg); box-shadow:25px 30px 0 #0e3929; } .caption { position:absolute; right:28px; bottom:28px; left:28px; z-index:2; color:#d1e1d7; font-size:12px; }
    @media(max-width:700px) { .hero { grid-template-columns:1fr; } .copy { min-height:70vh; } .visual { min-height:46vh; } .logo { position:static; margin-bottom:15vh; } h1 { font-size:clamp(52px,14vw,90px); } }
  </style>
</head>
<body>
  <main class="hero"><section class="copy"><div class="logo">form<span>/</span>function</div><span class="eyebrow">A design practice</span><h1>Make it useful. Make it felt.</h1><p>We shape identities and digital products for people building something that deserves to exist.</p><div class="actions"><a class="primary" href="#work">See our work ↗</a><a class="secondary" href="#contact">Start a conversation</a></div></section><section class="visual" aria-label="Abstract coral and cream shape"><div class="shape"></div><div class="caption">A split-screen hero creates a natural tension between message and image.</div></section></main>
</body>
</html>

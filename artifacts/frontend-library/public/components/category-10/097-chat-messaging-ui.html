<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Messaging UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d1118; --surface:#151c27; --surface2:#1d2734; --line:#2a3748; --text:#f0f5fb; --muted:#8998aa; --blue:#568ee8; --purple:#9374e8; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 20% 0,#25395d,transparent 38%),var(--bg); font:14px/1.5 "Manrope",sans-serif; } .chat { display:grid; grid-template-rows:67px 1fr 70px; width:min(650px,calc(100% - 36px)); height:650px; overflow:hidden; border:1px solid var(--line); border-radius:17px; background:var(--surface); box-shadow:0 25px 75px #0009; } .head { display:flex; align-items:center; gap:11px; padding:0 20px; border-bottom:1px solid var(--line); } .avatar { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; color:#fff; background:linear-gradient(135deg,#6ca4e8,#9d68d7); font-size:11px; font-weight:700; } .head strong { display:block; } .head small { color:#61d19b; font-size:11px; } .head button { margin-left:auto; border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:19px; } .messages { display:flex; flex-direction:column; gap:18px; overflow:auto; padding:25px 21px; } .date { align-self:center; color:var(--muted); font-size:11px; } .message { display:flex; align-items:end; gap:8px; max-width:75%; } .message.me { align-self:flex-end; justify-content:flex-end; } .bubble { padding:10px 13px; border-radius:13px 13px 13px 3px; color:#c5ced9; background:var(--surface2); } .me .bubble { border-radius:13px 13px 3px 13px; color:#fff; background:var(--blue); } .message time { color:var(--muted); font-size:10px; white-space:nowrap; } .composer { display:flex; align-items:center; gap:8px; padding:13px 17px; border-top:1px solid var(--line); } .composer input { min-width:0; flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:9px; outline:0; color:var(--text); background:#0f151e; } .composer button { display:grid; place-items:center; width:38px; height:38px; border:0; border-radius:9px; color:#fff; background:var(--blue); cursor:pointer; }
  </style>
</head>
<body>
  <main class="chat"><header class="head"><div class="avatar">NE</div><div><strong>Nadia El Idrissi</strong><small>● Online now</small></div><button type="button" aria-label="More conversation options">⋯</button></header><section class="messages" id="messages"><span class="date">Today, September 05</span><div class="message"><div class="avatar">NE</div><div class="bubble">Morning! I left a few notes on the research summary.</div><time>09:14</time></div><div class="message me"><div class="bubble">Perfect. I will fold them into the next draft.</div><time>09:16</time></div><div class="message"><div class="avatar">NE</div><div class="bubble">The section on onboarding is the one I would start with.</div><time>09:18</time></div></section><form class="composer" id="form"><input id="input" placeholder="Message Nadia..." aria-label="Message Nadia"><button type="submit" aria-label="Send message">↑</button></form></main>
  <script>
    const form=document.querySelector("#form"),input=document.querySelector("#input"),messages=document.querySelector("#messages");form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const row=document.createElement("div");row.className="message me";const safe=text.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));row.innerHTML=`<div class="bubble">${safe}</div><time>now</time>`;messages.append(row);input.value="";messages.scrollTop=messages.scrollHeight;});
  </script>
</body>
</html>

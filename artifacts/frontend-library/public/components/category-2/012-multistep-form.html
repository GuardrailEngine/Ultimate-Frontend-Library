<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multistep Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6f8; --surface:#fff; --ink:#17242c; --muted:#81909a; --line:#dde5e8; --teal:#168c83; --teal-soft:#dff3f0; --error:#d95160; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(140deg,#f4f6f8,#e8f1ef); font:15px/1.5 "Manrope",sans-serif; } button, input, select { font:inherit; }
    .layout { display:grid; grid-template-columns:280px 1fr; width:min(980px,100%); min-height:680px; margin:5vh auto; border:1px solid var(--line); border-radius:22px; overflow:hidden; background:var(--surface); box-shadow:0 25px 70px #1d4a4014; } aside { padding:42px 30px; color:#dcefea; background:#163a38; } .brand { color:#fff; font-weight:800; letter-spacing:-.06em; } .brand span { color:#84ded0; } aside h2 { margin:95px 0 12px; font-size:30px; line-height:1.05; letter-spacing:-.06em; } aside p { color:#9cc5bd; }
    .steps { display:grid; gap:18px; margin-top:45px; } .step { display:flex; align-items:center; gap:11px; color:#80a59e; font-size:13px; } .step i { display:grid; place-items:center; width:27px; height:27px; border:1px solid #5f8e87; border-radius:50%; font-style:normal; } .step.active { color:#fff; } .step.active i { color:#163a38; background:#a0e3d8; border-color:#a0e3d8; } .step.done i { color:#163a38; background:#84ded0; border-color:#84ded0; }
    .form-side { padding:clamp(28px,6vw,62px); } .form-side h1 { margin:0 0 7px; font-size:32px; letter-spacing:-.06em; } .sub { margin:0 0 34px; color:var(--muted); } .step-panel { display:none; } .step-panel.active { display:block; animation:enter .25s; } @keyframes enter { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:none; } } label { display:block; margin:0 0 7px; color:#50616a; font-size:13px; font-weight:700; } .field { margin-bottom:21px; } input, select { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:9px; outline:0; color:var(--ink); background:#fbfcfc; } input:focus, select:focus { border-color:var(--teal); box-shadow:0 0 0 3px #168c831f; } .field small { display:block; margin-top:5px; color:var(--error); } .invalid { border-color:var(--error); }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:40px; } .actions button { padding:12px 20px; border-radius:9px; cursor:pointer; font-weight:700; } .back { border:1px solid var(--line); color:var(--ink); background:#fff; } .next { margin-left:auto; border:1px solid var(--teal); color:#fff; background:var(--teal); } .summary { padding:16px; border-radius:10px; background:var(--teal-soft); } .summary p { margin:5px 0; color:#3a6863; }
    @media(max-width:700px) { .layout { display:block; width:calc(100% - 24px); margin:12px auto; } aside { padding:25px; } aside h2 { margin-top:38px; } .steps { grid-template-columns:repeat(3,1fr); margin-top:25px; } .step { display:grid; justify-items:center; gap:6px; text-align:center; } .step i { width:25px; height:25px; } .form-side { padding:30px 25px 38px; } }
  </style>
</head>
<body>
  <main class="layout"><aside><div class="brand">sprout<span>°</span></div><h2>Let's get you set up.</h2><p>A few thoughtful questions and you will be ready to grow.</p><div class="steps"><div class="step active"><i>1</i><span>Profile</span></div><div class="step"><i>2</i><span>Preferences</span></div><div class="step"><i>3</i><span>Finish</span></div></div></aside>
    <section class="form-side"><h1 id="title">Tell us about you</h1><p class="sub" id="subtitle">This helps us personalize your workspace.</p><form id="wizard" novalidate><div class="step-panel active" data-step="0"><div class="field"><label for="name">Full name</label><input id="name" required placeholder="e.g. Samira Khan"><small></small></div><div class="field"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@company.com"><small></small></div></div><div class="step-panel" data-step="1"><div class="field"><label for="role">Your role</label><select id="role" required><option value="">Choose a role</option><option>Design</option><option>Engineering</option><option>Marketing</option><option>Operations</option></select><small></small></div><div class="field"><label for="team">Team size</label><select id="team" required><option value="">Choose a size</option><option>Just me</option><option>2–10 people</option><option>11–50 people</option><option>51+ people</option></select><small></small></div></div><div class="step-panel" data-step="2"><div class="summary"><strong>You're all set.</strong><p id="summary"></p><p>We will use this to prepare your first workspace.</p></div></div><div class="actions"><button class="back" id="back" type="button" hidden>Back</button><button class="next" id="next" type="button">Continue</button></div></form></section>
  </main>
  <script>
    const panels = [...document.querySelectorAll(".step-panel")], steps = [...document.querySelectorAll(".step")], title = document.querySelector("#title"), subtitle = document.querySelector("#subtitle"), next = document.querySelector("#next"), back = document.querySelector("#back"), form = document.querySelector("#wizard"); let current = 0;
    const copy = [["Tell us about you","This helps us personalize your workspace."],["Shape your workspace","A little context goes a long way."],["Ready when you are","Review your details before you begin."]];
    function valid() { let okay = true; panels[current].querySelectorAll("[required]").forEach(field => { const message = field.parentElement.querySelector("small"); field.classList.toggle("invalid", !field.value); message.textContent = field.value ? "" : "This field is required."; if (field.type === "email" && field.value && !field.validity.valid) { field.classList.add("invalid"); message.textContent = "Enter a valid email."; } if (field.classList.contains("invalid")) okay = false; }); return okay; }
    function show(n) { current = n; panels.forEach((p,i) => p.classList.toggle("active", i === n)); steps.forEach((s,i) => { s.classList.toggle("active", i === n); s.classList.toggle("done", i < n); }); title.textContent = copy[n][0]; subtitle.textContent = copy[n][1]; back.hidden = n === 0; next.textContent = n === panels.length - 1 ? "Create workspace" : "Continue"; if (n === 2) document.querySelector("#summary").textContent = `${document.querySelector("#name").value} · ${document.querySelector("#role").value} · ${document.querySelector("#team").value}`; }
    next.addEventListener("click", () => { if (current < 2 && !valid()) return; if (current === 2) { next.textContent = "Workspace created ✓"; next.disabled = true; return; } show(current + 1); }); back.addEventListener("click", () => show(current - 1)); form.addEventListener("input", e => { e.target.classList.remove("invalid"); e.target.parentElement.querySelector("small")?.replaceChildren(); });
  </script>
</body>
</html>

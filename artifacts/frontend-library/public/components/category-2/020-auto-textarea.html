<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Textarea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f7fb; --surface:#fff; --ink:#202736; --muted:#8791a2; --line:#e0e5ee; --purple:#7b5df0; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 10% 10%,#e4ddff,transparent 35%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } button, textarea { font:inherit; }
    .card { width:min(600px,calc(100% - 36px)); padding:38px; border:1px solid var(--line); border-radius:22px; background:#fff; box-shadow:0 25px 70px #35326412; } .top { display:flex; align-items:start; justify-content:space-between; gap:15px; } .eyebrow { color:var(--purple); font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:10px 0 7px; font-size:32px; letter-spacing:-.07em; } .intro { margin:0 0 28px; color:var(--muted); } .counter { color:var(--muted); font-size:12px; white-space:nowrap; } .field { position:relative; } textarea { display:block; width:100%; min-height:56px; max-height:310px; overflow-y:hidden; padding:15px 15px 38px; border:1px solid var(--line); border-radius:11px; outline:0; color:var(--ink); background:#fbfcff; line-height:1.55; resize:none; } textarea:focus { border-color:var(--purple); box-shadow:0 0 0 3px #7b5df01d; } .tools { position:absolute; right:10px; bottom:10px; left:10px; display:flex; align-items:center; justify-content:space-between; } .tools span { color:var(--muted); font-size:12px; } .send { display:grid; place-items:center; width:29px; height:29px; border:0; border-radius:8px; color:#fff; background:var(--purple); cursor:pointer; } .send:disabled { opacity:.35; cursor:not-allowed; } .tip { margin-top:12px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Quick reply</span><h1>Leave a thoughtful note.</h1></div><span class="counter"><b id="count">0</b>/280</span></div><p class="intro">The field grows with you, so your message always has room to breathe.</p><form id="form"><div class="field"><textarea id="message" maxlength="280" placeholder="Write something kind..." rows="1"></textarea><div class="tools"><span id="status">0 characters</span><button class="send" id="send" type="submit" aria-label="Send message" disabled>↑</button></div></div><div class="tip">⌘ + Enter to send</div></form></main>
  <script>
    const textarea = document.querySelector("#message"), count = document.querySelector("#count"), status = document.querySelector("#status"), send = document.querySelector("#send"), form = document.querySelector("#form");
    function resize() { textarea.style.height = "auto"; textarea.style.height = `${Math.min(textarea.scrollHeight,310)}px`; const length = textarea.value.length; count.textContent = length; status.textContent = `${length} character${length === 1 ? "" : "s"}`; send.disabled = !textarea.value.trim(); }
    textarea.addEventListener("input", resize); textarea.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !send.disabled) form.requestSubmit(); }); form.addEventListener("submit", e => { e.preventDefault(); status.textContent = "Sent ✓"; send.disabled = true; textarea.disabled = true; });
  </script>
</body>
</html>

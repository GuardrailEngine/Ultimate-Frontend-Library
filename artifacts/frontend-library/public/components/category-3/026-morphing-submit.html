<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Submit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#101116; --surface:#191c25; --line:#303543; --text:#eff2f9; --muted:#8d96a8; --purple:#8f7cff; --green:#67d7a2; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 70% 20%,#33295c,transparent 38%),var(--bg); font:15px/1.5 "DM Sans",sans-serif; } .stage { text-align:center; } h1 { margin:0 0 10px; font-size:clamp(43px,7vw,78px); line-height:.95; letter-spacing:-.09em; } .intro { margin:0 auto 45px; color:var(--muted); font-size:17px; }
    .morph { position:relative; display:inline-flex; align-items:center; justify-content:center; min-width:180px; height:54px; padding:0 26px; border:0; border-radius:10px; color:#fff; background:var(--purple); font-weight:700; cursor:pointer; transition:width .35s,border-radius .35s,background .35s; } .morph .spinner { display:none; width:20px; height:20px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; } .morph.loading { width:54px; min-width:54px; padding:0; border-radius:50%; background:#5f52bb; } .morph.loading .label { display:none; } .morph.loading .spinner { display:block; } .morph.success { width:54px; min-width:54px; padding:0; border-radius:50%; background:var(--green); } .morph.success .label { display:none; } .morph.success .check { display:block; } .check { display:none; font-size:22px; } @keyframes spin { to { transform:rotate(360deg); } } .status { min-height:22px; margin-top:23px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="stage"><h1>One smooth transition.</h1><p class="intro">A submit action can acknowledge progress, processing, and success without sending the user elsewhere.</p><form id="form"><button class="morph" id="submit" type="submit"><span class="label">Publish update</span><i class="spinner"></i><span class="check">✓</span></button></form><div class="status" id="status" role="status">Ready when you are.</div></main>
  <script>
    const form = document.querySelector("#form"), button = document.querySelector("#submit"), status = document.querySelector("#status"); form.addEventListener("submit", e => { e.preventDefault(); if (button.classList.contains("success")) return; button.classList.add("loading"); status.textContent = "Publishing your update…"; setTimeout(() => { button.classList.remove("loading"); button.classList.add("success"); status.textContent = "Published successfully."; }, 1500); });
  </script>
</body>
</html>

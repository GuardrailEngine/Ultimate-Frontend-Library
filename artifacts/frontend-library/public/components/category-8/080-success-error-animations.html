<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success Error Animations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f7f8; --surface:#fff; --ink:#1b2722; --muted:#7f8d84; --line:#dfe7e2; --green:#35ad79; --red:#e15c6c; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(145deg,#f5f7f8,#e4f1ea); font:14px/1.5 "Manrope",sans-serif; } .card { width:min(480px,calc(100% - 36px)); padding:35px; border:1px solid var(--line); border-radius:19px; background:var(--surface); box-shadow:0 22px 60px #31534412; text-align:center; } .eyebrow { color:var(--green); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 8px; font-size:31px; letter-spacing:-.08em; } .intro { margin:0 0 29px; color:var(--muted); } .buttons { display:flex; justify-content:center; gap:8px; } .buttons button { padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:700; } .success-btn { border:1px solid var(--green); color:var(--green); background:#e9f9f0; } .error-btn { border:1px solid var(--red); color:var(--red); background:#fff0f1; }
    .result { min-height:190px; margin-top:25px; padding-top:23px; border-top:1px solid var(--line); } .icon { display:grid; place-items:center; width:70px; height:70px; margin:0 auto 18px; border:4px solid currentColor; border-radius:50%; font-size:34px; font-weight:700; } .result.success { color:var(--green); } .result.error { color:var(--red); } .result h2 { margin:0 0 6px; color:var(--ink); font-size:22px; } .result p { margin:0; color:var(--muted); } .result.success .icon { animation:pop .35s ease; } .result.error .icon { animation:shake .35s ease; } .check { display:block; width:29px; height:16px; border-bottom:4px solid currentColor; border-left:4px solid currentColor; transform:rotate(-45deg) translate(4px,-3px); } @keyframes pop { 0% { transform:scale(.4); opacity:0; } 80% { transform:scale(1.12); } 100% { transform:none; opacity:1; } } @keyframes shake { 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
  </style>
</head>
<body>
  <main class="card"><span class="eyebrow">State with meaning</span><h1>Make the result unmistakable.</h1><p class="intro">A clear motion cue helps the user understand whether the action worked or needs another try.</p><div class="buttons"><button class="success-btn" id="successBtn" type="button">Show success</button><button class="error-btn" id="errorBtn" type="button">Show error</button></div><section class="result success" id="result" aria-live="polite"><div class="icon"><i class="check"></i></div><h2 id="title">All set.</h2><p id="message">Your changes have been saved.</p></section></main>
  <script>
    const result=document.querySelector("#result"),icon=result.querySelector(".icon"),title=document.querySelector("#title"),message=document.querySelector("#message"); function show(type){result.className=`result ${type}`;icon.innerHTML=type==="success"?'<i class="check"></i>':"×";title.textContent=type==="success"?"All set.":"Something went wrong.";message.textContent=type==="success"?"Your changes have been saved.":"We could not save your changes. Try again.";void result.offsetWidth;result.classList.add(type);} document.querySelector("#successBtn").addEventListener("click",()=>show("success"));document.querySelector("#errorBtn").addEventListener("click",()=>show("error"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Line Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f7f8fc; --surface:#fff; --ink:#1b2432; --muted:#8993a3; --line:#e7eaf0; --purple:#7359ec; --teal:#2eb49d; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f7f8fc,#edf0ff); font:14px/1.5 "DM Sans",sans-serif; } .card { width:min(900px,calc(100% - 36px)); margin:7vh auto; padding:32px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:0 20px 60px #2f3c7212; } .top { display:flex; align-items:start; justify-content:space-between; gap:18px; } .eyebrow { color:var(--purple); font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 4px; font-size:30px; letter-spacing:-.07em; } .sub { margin:0; color:var(--muted); } .metric { text-align:right; } .metric strong { display:block; font-size:29px; letter-spacing:-.05em; } .metric span { color:var(--teal); font-size:12px; }
    .chart { position:relative; margin-top:30px; } svg { display:block; width:100%; height:auto; overflow:visible; } .grid-line { stroke:var(--line); stroke-width:1; } .axis { fill:var(--muted); font-size:11px; } .line { fill:none; stroke:var(--purple); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1000; stroke-dashoffset:1000; animation:draw 1.2s ease forwards; } @keyframes draw { to { stroke-dashoffset:0; } } .area { fill:url(#area); opacity:.55; } .point { fill:var(--surface); stroke:var(--purple); stroke-width:3; cursor:pointer; transition:r .2s; } .point:hover { r:6; } .tooltip { position:absolute; padding:7px 9px; border-radius:7px; color:#fff; background:#1b2432; font-size:12px; opacity:0; pointer-events:none; transform:translate(-50%,-115%); transition:opacity .15s; } .legend { display:flex; gap:20px; margin-top:16px; color:var(--muted); font-size:12px; } .legend i { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--purple); }
  </style>
</head>
<body>
  <main class="card"><div class="top"><div><span class="eyebrow">Weekly performance</span><h1>Activation rate</h1><p class="sub">People reaching their first meaningful moment</p></div><div class="metric"><strong>68.4%</strong><span>↗ 12.8% this week</span></div></div><div class="chart"><div class="tooltip" id="tooltip"></div><svg id="chart" viewBox="0 0 800 340" role="img" aria-label="Line chart showing activation rising across seven days"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7359ec" stop-opacity=".28"/><stop offset="1" stop-color="#7359ec" stop-opacity="0"/></linearGradient></defs><g id="grid"></g><path class="area" id="areaPath"></path><path class="line" id="line"></path><g id="points"></g><g id="labels"></g></svg></div><div class="legend"><span><i></i>Activation</span><span>Hover a point for details</span></div></main>
  <script>
    const values = [42,46,43,55,58,64,68], labels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], svg = document.querySelector("#chart"), grid = document.querySelector("#grid"), points = document.querySelector("#points"), labelGroup = document.querySelector("#labels"), line = document.querySelector("#line"), area = document.querySelector("#areaPath"), tooltip = document.querySelector("#tooltip"), chartBox = document.querySelector(".chart");
    const left=55, right=780, top=25, bottom=275, max=80, x=i=>left+i*(right-left)/(values.length-1), y=v=>bottom-v/max*(bottom-top);
    grid.innerHTML = [0,20,40,60,80].map(v => `<line class="grid-line" x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="8" y="${y(v)+4}">${v}%</text>`).join("");
    const path = values.map((v,i) => `${i ? "L" : "M"} ${x(i)} ${y(v)}`).join(" "); line.setAttribute("d",path); area.setAttribute("d",`${path} L ${x(values.length-1)} ${bottom} L ${x(0)} ${bottom} Z`); points.innerHTML = values.map((v,i) => `<circle class="point" cx="${x(i)}" cy="${y(v)}" r="4" data-label="${labels[i]}" data-value="${v}%"/>`).join(""); labelGroup.innerHTML = labels.map((label,i) => `<text class="axis" x="${x(i)}" y="310" text-anchor="middle">${label}</text>`).join("");
    points.querySelectorAll(".point").forEach(point => point.addEventListener("mouseenter", () => { const rect = chartBox.getBoundingClientRect(), svgRect = svg.getBoundingClientRect(), scaleX = svgRect.width / 800, px = Number(point.getAttribute("cx")) * scaleX + svgRect.left - rect.left; tooltip.textContent = `${point.dataset.label}: ${point.dataset.value}`; tooltip.style.left = `${px}px`; tooltip.style.top = `${Number(point.getAttribute("cy")) * svgRect.height / 340}px`; tooltip.style.opacity = "1"; })); points.querySelectorAll(".point").forEach(point => point.addEventListener("mouseleave", () => tooltip.style.opacity = "0"));
  </script>
</body>
</html>

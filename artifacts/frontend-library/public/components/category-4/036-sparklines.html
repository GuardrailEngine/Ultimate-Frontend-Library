<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparklines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f8f8; --surface:#fff; --ink:#17231f; --muted:#7d8a84; --line:#e2e9e6; --green:#229d77; --blue:#4e82dc; --orange:#e18b4e; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f6f8f8,#e9f3ef); font:14px/1.5 "Manrope",sans-serif; } .page { width:min(970px,calc(100% - 36px)); margin:8vh auto; } .top { display:flex; justify-content:space-between; align-items:end; margin-bottom:26px; } .eyebrow { color:var(--green); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:8px 0 0; font-size:35px; letter-spacing:-.08em; } .period { padding:8px 10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:#fff; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; } .metric { padding:23px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 8px 25px #1d54420b; } .metric-head { display:flex; justify-content:space-between; align-items:center; } .metric label { color:var(--muted); } .metric .change { color:var(--green); font-size:12px; font-weight:700; } .metric strong { display:block; margin:13px 0 12px; font-size:30px; letter-spacing:-.08em; } svg { display:block; width:100%; height:52px; overflow:visible; } .spark { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; } .area { opacity:.1; } .green { stroke:var(--green); fill:var(--green); } .blue { stroke:var(--blue); fill:var(--blue); } .orange { stroke:var(--orange); fill:var(--orange); } .hint { margin-top:25px; color:var(--muted); font-size:12px; }
    @media(max-width:670px) { .cards { grid-template-columns:1fr; } .metric { display:grid; grid-template-columns:1fr 150px; align-items:center; gap:10px; } .metric-head { grid-column:1; } .metric strong { margin:5px 0 0; } .metric svg { grid-column:2; grid-row:1/3; } }
  </style>
</head>
<body>
  <main class="page"><div class="top"><div><span class="eyebrow">At a glance</span><h1>Small charts, useful signals.</h1></div><span class="period">Last 30 days⌄</span></div><section class="cards"><article class="metric"><div class="metric-head"><label>Visitors</label><span class="change">+18.4%</span></div><strong>24,891</strong><svg viewBox="0 0 220 52" aria-label="Visitors trending upward"><path class="area green" d="M0 43 20 37 40 40 60 29 80 34 100 20 120 26 140 18 160 21 180 8 220 13V52H0Z"/><path class="spark green" d="M0 43 20 37 40 40 60 29 80 34 100 20 120 26 140 18 160 21 180 8 220 13"/></svg></article><article class="metric"><div class="metric-head"><label>Conversion</label><span class="change">+6.2%</span></div><strong>4.83%</strong><svg viewBox="0 0 220 52" aria-label="Conversion trending upward"><path class="area blue" d="M0 35 20 38 40 30 60 32 80 27 100 31 120 17 140 23 160 16 180 20 220 7V52H0Z"/><path class="spark blue" d="M0 35 20 38 40 30 60 32 80 27 100 31 120 17 140 23 160 16 180 20 220 7"/></svg></article><article class="metric"><div class="metric-head"><label>Avg. response</label><span class="change" style="color:var(--orange)">-11.8%</span></div><strong>42 min</strong><svg viewBox="0 0 220 52" aria-label="Response time trending downward"><path class="area orange" d="M0 10 20 14 40 12 60 22 80 20 100 27 120 24 140 34 160 31 180 41 220 44V52H0Z"/><path class="spark orange" d="M0 10 20 14 40 12 60 22 80 20 100 27 120 24 140 34 160 31 180 41 220 44"/></svg></article></section><p class="hint">Sparklines show direction without making the reader study a full chart.</p></main>
</body>
</html>

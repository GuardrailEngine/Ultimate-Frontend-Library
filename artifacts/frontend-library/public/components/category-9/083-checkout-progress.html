<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f7f6f2; --surface:#fff; --ink:#1a241e; --muted:#849087; --line:#dfe5de; --green:#27865c; --cream:#fff2d4; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f7f6f2,#eaf1e7); font:14px/1.5 "Manrope",sans-serif; } .page { width:min(800px,calc(100% - 36px)); margin:8vh auto; } .top { text-align:center; } .eyebrow { color:var(--green); font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:11px 0 8px; font-size:clamp(42px,7vw,70px); line-height:.95; letter-spacing:-.1em; } .intro { margin:0 0 35px; color:var(--muted); font-size:17px; } .steps { display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:35px; } .step { position:relative; display:grid; justify-items:center; gap:7px; color:var(--muted); font-size:12px; } .step:before { content:""; position:absolute; top:14px; left:50%; width:100%; height:1px; background:var(--line); } .step:last-child:before { display:none; } .step i { position:relative; z-index:1; display:grid; place-items:center; width:29px; height:29px; border:1px solid var(--line); border-radius:50%; background:var(--bg); font-style:normal; } .step.active { color:var(--green); font-weight:700; } .step.active i, .step.done i { border-color:var(--green); color:#fff; background:var(--green); } .checkout { padding:26px; border:1px solid var(--line); border-radius:16px; background:var(--surface); } .panel { display:none; } .panel.active { display:block; } .panel h2 { margin:0 0 18px; font-size:21px; letter-spacing:-.05em; } label { display:block; margin-bottom:7px; font-size:12px; font-weight:700; } input { width:100%; margin-bottom:16px; padding:12px; border:1px solid var(--line); border-radius:8px; outline:0; } .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:5px; } .actions button { padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:700; } .back { border:1px solid var(--line); color:var(--ink); background:#fff; } .next { border:1px solid var(--green); color:#fff; background:var(--green); }
    @media(max-width:500px) { .step span { font-size:11px; } .checkout { padding:20px; } }
  </style>
</head>
<body>
  <main class="page"><section class="top"><span class="eyebrow">Almost yours</span><h1>Checkout without the clutter.</h1><p class="intro">Three clear steps. No surprises at the last screen.</p></section><div class="steps"><div class="step active"><i>1</i><span>Details</span></div><div class="step"><i>2</i><span>Delivery</span></div><div class="step"><i>3</i><span>Payment</span></div></div><form class="checkout" id="checkout"><section class="panel active"><h2>Your details</h2><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"><label for="name">Full name</label><input id="name" required placeholder="Samira Khan"></section><section class="panel"><h2>Delivery address</h2><label for="address">Address</label><input id="address" required placeholder="12 Palm Street"><label for="city">City</label><input id="city" required placeholder="Casablanca"></section><section class="panel"><h2>Payment method</h2><label for="card">Card number</label><input id="card" required inputmode="numeric" placeholder="0000 0000 0000 0000"><div style="padding:13px;border-radius:8px;background:var(--cream);color:#766a50;font-size:12px">Your payment details are encrypted and never stored here.</div></section><div class="actions"><button class="back" id="back" type="button" hidden>Back</button><button class="next" id="next" type="button">Continue</button></div></form></main>
  <script>
    const panels=[...document.querySelectorAll(".panel")],steps=[...document.querySelectorAll(".step")],next=document.querySelector("#next"),back=document.querySelector("#back"),form=document.querySelector("#checkout");let current=0;function show(n){current=n;panels.forEach((p,i)=>p.classList.toggle("active",i===n));steps.forEach((s,i)=>{s.classList.toggle("active",i===n);s.classList.toggle("done",i<n);});back.hidden=n===0;next.textContent=n===2?"Place order":"Continue"}function valid(){let ok=true;panels[current].querySelectorAll("[required]").forEach(input=>{if(!input.value.trim()){input.style.borderColor="#d55c62";ok=false}else input.style.borderColor=""});return ok}next.addEventListener("click",()=>{if(!valid())return;if(current===2){next.textContent="Order placed ✓";next.disabled=true;return}show(current+1)});back.addEventListener("click",()=>show(current-1));form.addEventListener("input",e=>e.target.style.borderColor="");
  </script>
</body>
</html>

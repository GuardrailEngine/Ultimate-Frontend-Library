<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f5f1; --surface:#fff; --ink:#1b2420; --muted:#7d8781; --line:#e2e0d8; --orange:#c96741; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 80% 0,#f2d8bd,transparent 35%),var(--bg); font:14px/1.5 "DM Sans",sans-serif; } .page { display:grid; grid-template-columns:235px 1fr; gap:28px; width:min(950px,calc(100% - 36px)); margin:7vh auto; } aside { align-self:start; padding:22px; border:1px solid var(--line); border-radius:15px; background:var(--surface); } .filter-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--line); } .filter-head h1 { margin:0; font-size:18px; } .clear { border:0; color:var(--orange); background:transparent; cursor:pointer; font-size:12px; } .group { padding:19px 0; border-bottom:1px solid var(--line); } .group:last-child { border-bottom:0; } .group h2 { margin:0 0 13px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; } .check { display:flex; align-items:center; gap:8px; margin:9px 0; color:var(--muted); cursor:pointer; } input { accent-color:var(--orange); } .content-head { display:flex; justify-content:space-between; align-items:end; margin-bottom:18px; } .content-head h2 { margin:0; font-size:29px; letter-spacing:-.07em; } .content-head span { color:var(--muted); } .products { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; } .product { padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); } .image { display:grid; place-items:center; height:210px; border-radius:9px; color:#fff8; background:linear-gradient(145deg,#d58d69,#6f4546); font-size:27px; } .product:nth-child(2) .image { background:linear-gradient(145deg,#92aaa3,#405d5d); } .product h3 { margin:13px 3px 2px; font-size:15px; } .product p { margin:0 3px; color:var(--muted); font-size:12px; }
    @media(max-width:700px) { .page { display:block; width:calc(100% - 24px); } aside { margin-bottom:22px; } .products { grid-template-columns:repeat(2,1fr); } } @media(max-width:450px) { .products { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="page"><aside><div class="filter-head"><h1>Filter by</h1><button class="clear" id="clear" type="button">Clear all</button></div><div class="group"><h2>Category</h2><label class="check"><input type="checkbox" value="Lighting"> Lighting</label><label class="check"><input type="checkbox" value="Objects"> Objects</label><label class="check"><input type="checkbox" value="Textiles"> Textiles</label></div><div class="group"><h2>Availability</h2><label class="check"><input type="checkbox" value="In stock"> In stock</label><label class="check"><input type="checkbox" value="Made to order"> Made to order</label></div></aside><section><div class="content-head"><h2>All objects</h2><span id="count">4 products</span></div><div class="products" id="products"><article class="product" data-categories="Lighting"><div class="image">01</div><h3>Solace lamp</h3><p>Lighting · $148</p></article><article class="product" data-categories="Objects"><div class="image">02</div><h3>Clay vessel</h3><p>Objects · $64</p></article><article class="product" data-categories="Textiles"><div class="image" style="background:linear-gradient(145deg,#d8b775,#7b4a3b)">03</div><h3>Woven throw</h3><p>Textiles · $92</p></article><article class="product" data-categories="Lighting Objects"><div class="image" style="background:linear-gradient(145deg,#617ca3,#34415d)">04</div><h3>Orbit candle</h3><p>Objects · $38</p></article></div></section></main>
  <script>
    const checks=document.querySelectorAll("aside input"), products=document.querySelectorAll(".product"), count=document.querySelector("#count"); function filter(){const selected=[...checks].filter(c=>c.checked).map(c=>c.value);let visible=0;products.forEach(product=>{const show=!selected.length||selected.some(value=>product.dataset.categories.includes(value));product.hidden=!show;if(show)visible++});count.textContent=`${visible} product${visible===1?"":"s"}`}checks.forEach(check=>check.addEventListener("change",filter));document.querySelector("#clear").addEventListener("click",()=>{checks.forEach(c=>c.checked=false);filter()});
  </script>
</body>
</html>
